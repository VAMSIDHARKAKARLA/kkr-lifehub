<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#111827">

<meta name="description"
      content="KKR LifeHub - Your life, organized.">

<link rel="manifest"
      href="./manifest.json">

<title>KKR LifeHub</title>

<style>

/* =====================================================
   KKR LIFEHUB - PROFESSIONAL MOBILE APP DESIGN
   ===================================================== */

:root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --text: #172033;
    --text-soft: #64748b;
    --border: #e2e8f0;
    --primary: #111827;
    --primary-soft: #e8eefc;
    --blue: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --orange: #ea580c;
    --purple: #7c3aed;
    --cyan: #0891b2;
    --shadow: 0 4px 16px rgba(15, 23, 42, 0.07);
    --radius: 14px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    padding-top: 58px;
    padding-bottom: 64px;
}

/* =====================================================
   PERMANENT TOP BAR
   ===================================================== */

.kkr-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    height: 58px;

    background: #111827;
    color: white;

    display: flex;
    align-items: center;

    padding: 0 12px;

    z-index: 999999;

    box-shadow: 0 2px 12px rgba(0,0,0,0.20);
}

.kkr-menu-btn {
    width: 44px;
    height: 44px;

    border: none;
    background: transparent;

    color: white;

    font-size: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    cursor: pointer;
}

.kkr-menu-btn:active {
    background: rgba(255,255,255,0.12);
}

.kkr-top-title {
    margin-left: 8px;

    font-size: 17px;
    font-weight: 650;

    letter-spacing: 0.1px;
}

/* =====================================================
   APP CONTENT
   ===================================================== */

#app {
    min-height: calc(100vh - 122px);
}

.container {
    padding: 15px;
    max-width: 720px;
    margin: 0 auto;
}

.header {
    background: #111827;
    color: white;

    padding: 18px 16px;

    border-radius: 0 0 18px 18px;
}

.header h1 {
    margin: 0 0 4px 0;

    font-size: 21px;
    font-weight: 650;
}

.header p {
    margin: 0;

    font-size: 12px;

    opacity: 0.75;
}

.page-title {
    margin: 17px 0 13px;
}

.page-title h2 {
    margin: 0 0 4px;

    font-size: 19px;
    font-weight: 650;
}

.page-title p {
    margin: 0;

    color: var(--text-soft);
    font-size: 12px;
}

/* =====================================================
   DASHBOARD
   ===================================================== */

.dashboard-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

.card {
    background: var(--surface);

    border: 1px solid rgba(226,232,240,0.7);

    padding: 14px;

    border-radius: var(--radius);

    box-shadow: var(--shadow);

    cursor: pointer;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.card:active {
    transform: scale(0.98);
}

.card-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background: var(--primary-soft);

    font-size: 21px;

    margin-bottom: 9px;
}

.card h3 {
    margin: 0 0 4px;

    font-size: 14px;
    font-weight: 650;
}

.card p {
    margin: 0;

    color: var(--text-soft);

    font-size: 11px;

    line-height: 1.4;
}

/* =====================================================
   COLOR ACCENTS
   ===================================================== */

.accent-blue .card-icon {
    background: #dbeafe;
}

.accent-green .card-icon {
    background: #dcfce7;
}

.accent-orange .card-icon {
    background: #ffedd5;
}

.accent-purple .card-icon {
    background: #ede9fe;
}

.accent-cyan .card-icon {
    background: #cffafe;
}

.accent-red .card-icon {
    background: #fee2e2;
}

/* =====================================================
   EMERGENCY
   ===================================================== */

.emergency {
    background: #fff7ed;

    border: 1px solid #fed7aa;

    padding: 13px;

    border-radius: 13px;

    margin-bottom: 14px;
}

.emergency h3 {
    margin: 0 0 4px;

    color: #c2410c;

    font-size: 14px;
}

.emergency p {
    margin: 0;

    color: #9a3412;

    font-size: 11px;
}

/* =====================================================
   GENERAL CARDS
   ===================================================== */

.section-card {
    background: var(--surface);

    padding: 15px;

    border-radius: var(--radius);

    box-shadow: var(--shadow);

    margin-bottom: 12px;
}

.section-card h3 {
    margin: 0 0 5px;

    font-size: 15px;
}

.section-card p {
    margin: 0;

    color: var(--text-soft);

    font-size: 12px;
}

/* =====================================================
   BUTTONS
   ===================================================== */

button {
    font-family: inherit;
}

.primary,
.secondary,
.danger,
.success-button {
    width: 100%;

    border: none;

    padding: 12px;

    border-radius: 10px;

    font-size: 13px;

    font-weight: 650;

    cursor: pointer;

    margin-top: 7px;
}

.primary {
    background: #111827;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.danger {
    background: #fee2e2;
    color: #991b1b;
}

.success-button {
    background: #dcfce7;
    color: #166534;
}

/* =====================================================
   FORMS
   ===================================================== */

label {
    display: block;

    font-size: 12px;

    font-weight: 650;

    margin-top: 10px;
}

input,
textarea,
select {
    width: 100%;

    padding: 11px;

    margin-top: 6px;

    margin-bottom: 8px;

    border: 1px solid var(--border);

    border-radius: 9px;

    background: white;

    color: #111827;

    font-family: inherit;

    font-size: 13px;

    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #93c5fd;

    box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
}

textarea {
    min-height: 85px;

    resize: vertical;
}

/* =====================================================
   LIST ITEMS
   ===================================================== */

.item {
    background: var(--surface);

    padding: 14px;

    border-radius: 13px;

    box-shadow: var(--shadow);

    margin-bottom: 10px;
}

.item h3 {
    margin: 0 0 6px;

    font-size: 14px;
}

.item p {
    margin: 4px 0;

    color: var(--text-soft);

    font-size: 12px;
}

.item-buttons {
    display: flex;

    gap: 7px;

    margin-top: 10px;
}

.item-buttons button {
    flex: 1;

    margin: 0;

    padding: 9px;

    border: none;

    border-radius: 8px;

    font-size: 12px;

    font-weight: 600;
}

/* =====================================================
   BACK BUTTON
   ===================================================== */

.back-button {
    width: 100%;

    padding: 11px;

    margin-top: 10px;

    border: none;

    border-radius: 10px;

    background: #e5e7eb;

    color: #111827;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;
}

/* =====================================================
   STATISTICS
   ===================================================== */

.stat-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-bottom: 12px;
}

.stat {
    background: white;

    padding: 13px;

    border-radius: 13px;

    box-shadow: var(--shadow);
}

.stat-title {
    color: var(--text-soft);

    font-size: 11px;
}

.stat-value {
    margin-top: 4px;

    font-size: 19px;

    font-weight: 700;
}

.income {
    color: #15803d;
}

.expense {
    color: #b91c1c;
}

.balance {
    color: #1d4ed8;
}

/* =====================================================
   STATUS / EMPTY
   ===================================================== */

.success-message {
    background: #f0fdf4;

    color: #166534;

    padding: 11px;

    border-radius: 9px;

    font-size: 12px;

    margin-bottom: 10px;
}

.empty {
    text-align: center;

    padding: 30px 15px;

    color: var(--text-soft);

    font-size: 12px;
}

/* =====================================================
   BOTTOM NAVIGATION
   ===================================================== */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 64px;

    background: rgba(255,255,255,0.97);

    border-top: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-around;

    z-index: 999998;

    box-shadow: 0 -2px 12px rgba(15,23,42,0.05);
}

.nav-item {
    flex: 1;

    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 2px;

    color: #64748b;

    font-size: 10px;

    cursor: pointer;
}

.nav-item.active {
    color: #111827;

    font-weight: 650;
}

.nav-icon {
    font-size: 19px;

    line-height: 1;
}

/* =====================================================
   FOOTER
   ===================================================== */

.footer {
    text-align: center;

    color: #94a3b8;

    font-size: 10px;

    margin: 22px 0 10px;
}
      /* =====================================================
   SIDE MENU
   ===================================================== */

.menu-overlay {
    position: fixed;

    inset: 0;

    background: rgba(15,23,42,0.45);

    z-index: 9999998;

    display: none;
}

.menu-overlay.show {
    display: block;
}

.side-menu {
    position: fixed;

    top: 0;
    left: 0;
    bottom: 0;

    width: min(86%, 350px);

    background: var(--surface);

    z-index: 9999999;

    overflow-y: auto;

    transform: translateX(-100%);

    transition: transform 0.22s ease;

    box-shadow: 8px 0 25px rgba(0,0,0,0.20);
}

.side-menu.open {
    transform: translateX(0);
}

.menu-header {
    background: #111827;

    color: white;

    padding: 24px 18px;
}

.menu-header h2 {
    margin: 0;

    font-size: 19px;
}

.menu-header p {
    margin: 5px 0 0;

    font-size: 11px;

    opacity: 0.7;
}

.menu-list {
    padding: 10px;
}

.menu-item {
    width: 100%;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 12px;

    margin-bottom: 4px;

    border: none;

    border-radius: 11px;

    background: transparent;

    color: var(--text);

    text-align: left;

    font-family: inherit;

    font-size: 13px;

    cursor: pointer;
}

.menu-item:active {
    background: #f1f5f9;
}

.menu-item-icon {
    width: 32px;
    height: 32px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 9px;

    background: #f1f5f9;

    font-size: 17px;
}

.menu-item-text {
    flex: 1;
}

.menu-item-title {
    font-weight: 650;
}

.menu-item-sub {
    margin-top: 2px;

    color: var(--text-soft);

    font-size: 10px;
}

.menu-close {
    width: 100%;

    margin-top: 8px;

    padding: 11px;

    border: none;

    border-radius: 10px;

    background: #e5e7eb;

    color: #111827;

    font-size: 12px;

    font-weight: 650;
}

/* =====================================================
   CHAT
   ===================================================== */

.chat-box {
    background: white;

    padding: 12px;

    border-radius: 14px;

    min-height: 280px;

    max-height: 390px;

    overflow-y: auto;

    box-shadow: var(--shadow);

    margin-bottom: 10px;
}

.chat-user,
.chat-ai {
    max-width: 86%;

    padding: 9px 11px;

    border-radius: 12px;

    margin: 7px 0;

    font-size: 12px;

    line-height: 1.45;
}

.chat-user {
    margin-left: auto;

    background: #111827;

    color: white;
}

.chat-ai {
    margin-right: auto;

    background: #eef2f7;

    color: #172033;
}

.quick-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 7px;

    margin-bottom: 10px;
}

.quick-buttons button {
    border: none;

    background: #e8eefc;

    color: #1e40af;

    padding: 9px;

    border-radius: 9px;

    font-size: 11px;

    font-weight: 600;
}

/* =====================================================
   SEARCH
   ===================================================== */

.search-box {
    position: relative;

    margin-bottom: 12px;
}

.search-box input {
    padding-left: 38px;

    margin-bottom: 0;
}

.search-icon {
    position: absolute;

    left: 12px;
    top: 50%;

    transform: translateY(-50%);

    font-size: 15px;
}

/* =====================================================
   TOAST
   ===================================================== */

.toast {
    position: fixed;

    left: 50%;

    bottom: 78px;

    transform: translateX(-50%) translateY(20px);

    background: #111827;

    color: white;

    padding: 10px 14px;

    border-radius: 10px;

    font-size: 11px;

    z-index: 10000000;

    opacity: 0;

    pointer-events: none;

    transition: all 0.2s ease;

    white-space: nowrap;
}

.toast.show {
    opacity: 1;

    transform: translateX(-50%) translateY(0);
}

/* =====================================================
   OFFLINE STATUS
   ===================================================== */

.online-status {
    display: inline-flex;

    align-items: center;

    gap: 5px;

    font-size: 10px;

    color: #15803d;

    margin-top: 6px;
}

.online-status.offline {
    color: #b91c1c;
}

.status-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: currentColor;
}

/* =====================================================
   DARK MODE
   ===================================================== */

body.dark {
    --bg: #0f172a;
    --surface: #111827;
    --surface-soft: #1e293b;
    --text: #f1f5f9;
    --text-soft: #94a3b8;
    --border: #334155;
    --primary-soft: #1e3a5f;
    --shadow: 0 4px 16px rgba(0,0,0,0.25);
}

body.dark .card,
body.dark .section-card,
body.dark .item,
body.dark .stat,
body.dark .chat-box {
    background: #111827;

    border-color: #1e293b;
}

body.dark input,
body.dark textarea,
body.dark select {
    background: #1e293b;

    color: white;

    border-color: #334155;
}

body.dark .secondary,
body.dark .back-button {
    background: #334155;

    color: white;
}

body.dark .bottom-nav {
    background: rgba(15,23,42,0.97);

    border-color: #334155;
}

body.dark .menu-item:active {
    background: #1e293b;
}

body.dark .menu-item-icon {
    background: #1e293b;
}

body.dark .chat-ai {
    background: #1e293b;

    color: #f1f5f9;
}

/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (min-width: 600px) {

    .dashboard-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .container {
        padding: 20px;
    }

}

</style>

</head>

<body>

<!-- ===================================================
     PERMANENT APP TOP BAR
     THIS NEVER GETS REPLACED
     =================================================== -->

<header class="kkr-topbar">

    <button
        class="kkr-menu-btn"
        id="menuButton"
        aria-label="Open menu"
        onclick="openSideMenu()">
        ☰
    </button>

    <div class="kkr-top-title">
        KKR LifeHub
    </div>

</header>


<!-- ===================================================
     DYNAMIC CONTENT AREA
     ONLY THIS AREA CHANGES
     =================================================== -->

<main id="app"></main>


<!-- ===================================================
     PERMANENT BOTTOM NAV
     =================================================== -->

<nav class="bottom-nav">

    <div class="nav-item active"
         id="navHome"
         onclick="showHome()">

        <span class="nav-icon">⌂</span>
        Home

    </div>

    <div class="nav-item"
         id="navAlerts"
         onclick="openAlerts()">

        <span class="nav-icon">🔔</span>
        Alerts

    </div>

    <div class="nav-item"
         id="navSettings"
         onclick="openSettings()">

        <span class="nav-icon">⚙</span>
        Settings

    </div>

</nav>


<!-- ===================================================
     SIDE MENU
     =================================================== -->

<div class="menu-overlay"
     id="menuOverlay"
     onclick="closeSideMenu()">
</div>

<aside class="side-menu"
       id="sideMenu">

    <div class="menu-header">

        <h2>KKR LifeHub</h2>

        <p>Your life, organized.</p>

    </div>

    <div class="menu-list">

        <button class="menu-item"
                onclick="openProfile()">

            <span class="menu-item-icon">👤</span>

            <span class="menu-item-text">

                <div class="menu-item-title">
                    Profile
                </div>

                <div class="menu-item-sub">
                    Manage your personal information
                </div>

            </span>

        </button>


        <button class="menu-item"
                onclick="openNotifications()">

            <span class="menu-item-icon">🔔</span>

            <span class="menu-item-text">

                <div class="menu-item-title">
                    Notifications
                </div>

                <div class="menu-item-sub">
                    Manage LifeHub notifications
                </div>

            </span>

        </button>


        <button class="menu-item"
                onclick="toggleTheme()">

            <span class="menu-item-icon">🌙</span>

            <span class="menu-item-text">

                <div class="menu-item-title">
                    Theme
                </div>

                <div class="menu-item-sub">
                    Light and dark mode
                </div>

            </span>

        </button>


        <button class="menu-item"
                onclick="openFontSettings()">

            <span class="menu-item-icon">🔤</span>

            <span class="menu-item-text">

                <div class="menu-item-title">
                    Font Size
                </div>

                <div class="menu-item-sub">
                    Make text smaller or larger
                </div>

            </span>

        </button>


        <button class="menu-item"
                onclick="openPrivacy()">

            <span class="menu-item-icon">🔒</span>

                    Privacy
                </div>

                <div class="menu-item-sub">

        <button class="menu-item"
                onclick="showStorageInfo()">

            <span class="menu-item-icon">💾</span>

                <div class="menu-item-title">
                    Storage
                </div>

                <div class="menu-item-sub">

        <button class="menu-item"

        <button class="menu-item"

            <span class="menu-item-text">

                </div>

                <div class="menu-item-sub">
                    Get help using LifeHub
                </div>

            </span>

        </button>


        <button class="menu-item"
                onclick="openAbout()">

            <span class="menu-item-icon">ℹ️</span>

            <span class="menu-item-text">

                <div class="menu-item-title">
                    About KKR LifeHub

        <button class="menu-close"
                onclick="closeSideMenu()">

            ✕ Close Menu

        </button>

    </div>

</aside>


<div class="toast" id="toast"></div>


<script>
      /* =====================================================
   KKR LIFEHUB JAVASCRIPT
   ===================================================== */

/* =====================================================
   STORAGE HELPERS
   ===================================================== */

function getData(key, fallback = []) {

    try {

        const data = localStorage.getItem(key);

        return data ? JSON.parse(data) : fallback;

    } catch (error) {

        return fallback;

    }

}


function saveData(key, data) {

    localStorage.setItem(
        key,
        JSON.stringify(data)
    );

}


/* =====================================================
   TOAST
   ===================================================== */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(function() {

        toast.classList.remove("show");

    }, 2200);

}


/* =====================================================
   MENU
   ===================================================== */

function openSideMenu() {

    document
        .getElementById("menuOverlay")
        .classList.add("show");

    document
        .getElementById("sideMenu")
        .classList.add("open");

}


function closeSideMenu() {

    document
        .getElementById("menuOverlay")
        .classList.remove("show");

    document
        .getElementById("sideMenu")
        .classList.remove("open");

}


/* =====================================================
   PAGE NAVIGATION
   ===================================================== */

let currentPage = "home";


function navigate(page, html, push = true) {

    closeSideMenu();

    document
        .getElementById("app")
        .innerHTML = html;

    currentPage = page;

    updateBottomNav(page);

    window.scrollTo({
        top: 0,
        behavior: "instant"
    });

    if (push) {

        history.pushState(
            { page: page },
            "",
            "#" + page
        );

    }

}


function updateBottomNav(page) {

    document
        .querySelectorAll(".nav-item")
        .forEach(function(item) {

            item.classList.remove("active");

        });

    if (
        page === "home" ||
        page === "health" ||
        page === "documents" ||
        page === "reminders" ||
        page === "family" ||
        page === "money" ||
        page === "ai"
    ) {

        document
            .getElementById("navHome")
            .classList.add("active");

    }

    if (page === "alerts") {

        document
            .getElementById("navAlerts")
            .classList.add("active");

    }

    if (page === "settings") {

function getGreeting() {

    const hour =

    if (hour < 17) {

    }

    return "Good Night";

}

function searchHome(value) {

    const search =
        value.toLowerCase().trim();

    document
        .querySelectorAll("#dashboardGrid .card")
        .forEach(function(card) {

            const text =
                card.dataset.search || "";

            card.style.display =
                text.includes(search)
                    ? ""
                    : "none";

        });

}


/* =====================================================

   ===================================================== */

function updateOnlineStatus() {

    const status =
        document.getElementById("onlineStatus");

    if (!status) return;

    if (navigator.onLine) {

        status.classList.remove("offline");

        status.innerHTML =
            '<span class="status-dot"></span> Online';

    } else {

        status.classList.add("offline");

        status.innerHTML =
            '<span class="status-dot"></span> Offline';

    }

}


window.addEventListener(
    "online",

);

window.addEventListener(
    "offline",

);

        title:
            document.getElementById("reminderTitle").value.trim(),

        date:
            document.getElementById("reminderDate").value,

        time:
            document.getElementById("reminderTime").value,

        notes:
            document.getElementById("reminderNotes").value.trim(),

        done: false

    };


    if (!reminder.title) {

        showToast("Please enter reminder");

        return;

    }


    reminders.push(reminder);

    saveData(
        "kkr_reminders",
        reminders
    );


    showToast("Reminder saved");

    openReminders();

function showReminders() {

    const list =
        document.getElementById("reminderList");

    if (!list) return;


    const reminders =
        getData("kkr_reminders");


    if (reminders.length === 0) {

        list.innerHTML = `
            <div class="empty">
                ⏰<br><br>
                No reminders added yet.
            </div>
        `;

        return;

    }


    list.innerHTML =
        reminders.map(function(item) {

            return `

                <div class="item">

                    <h3>
                        ⏰ ${escapeHTML(item.title)}
                    </h3>

                    <p>
                        <b>Date:</b>
                        ${escapeHTML(item.date || "-")}
                    </p>

                    <p>
                        <b>Time:</b>
                        ${escapeHTML(item.time || "-")}
                    </p>

                    <p>
                        <b>Status:</b>
                        ${item.done ? "Completed" : "Pending"}
                    </p>

                    <div class="item-buttons">

                        <button
                            style="background:#dcfce7;color:#166534;"
                            onclick="toggleReminder(${item.id})">

                            ${item.done ? "Undo" : "Done"}

                        </button>

                        <button
                            style="background:#fee2e2;color:#991b1b;"
                            onclick="deleteReminder(${item.id})">

                            Delete

                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


function toggleReminder(id) {

    const reminders =
        getData("kkr_reminders");


    const item =
        reminders.find(function(reminder) {

            return reminder.id === id;

        });


    if (!item) return;


    item.done = !item.done;


    saveData(
        "kkr_reminders",
        reminders
    );


    showReminders();

}


function deleteReminder(id) {

    if (!confirm("Delete this reminder?")) {

        return;

    }


    const reminders =
        getData("kkr_reminders");


    saveData(
        "kkr_reminders",

        reminders.filter(function(item) {

            return item.id !== id;

        })
    );


    showToast("Reminder deleted");

    showReminders();

                              }

function saveMoneyTransaction() {

    const money =
        getData("kkr_money");


    const transaction = {

        id: Date.now(),

        type:
            document.getElementById("moneyType").value,

        amount:
            Number(
                document.getElementById("moneyAmount").value
            ),

        category:
            document.getElementById("moneyCategory").value.trim(),

        notes:
            document.getElementById("moneyNotes").value.trim()

    };


    if (
        !transaction.amount ||
        transaction.amount <= 0
    ) {

        showToast("Enter a valid amount");

        return;

    }


    money.push(transaction);

    saveData(
        "kkr_money",
        money
    );


    showToast("Transaction saved");

    openMoney();

function showMoney() {

    const money =
        getData("kkr_money");


    let income = 0;
    let expense = 0;


    money.forEach(function(item) {

        if (item.type === "income") {

            income += item.amount;

        } else {

            expense += item.amount;

        }

    });


    const balance =
        income - expense;


    const incomeElement =
        document.getElementById("incomeTotal");

    const expenseElement =
        document.getElementById("expenseTotal");

    const balanceElement =
        document.getElementById("balanceTotal");

    const countElement =
        document.getElementById("transactionCount");


    if (!incomeElement) return;


    incomeElement.textContent =
        "₹" + income.toLocaleString("en-IN");

    expenseElement.textContent =
        "₹" + expense.toLocaleString("en-IN");

    balanceElement.textContent =
        "₹" + balance.toLocaleString("en-IN");

    countElement.textContent =
        money.length;


    const list =
        document.getElementById("moneyList");


    if (money.length === 0) {

        list.innerHTML = `
            <div class="empty">
                💰<br><br>
                No transactions yet.
            </div>
        `;

        return;

    }


    list.innerHTML =
        money.slice().reverse().map(function(item) {

            const color =
                item.type === "income"
                    ? "#15803d"
                    : "#b91c1c";


            const sign =
                item.type === "income"
                    ? "+"
                    : "-";


            return `

                <div class="item">

                    <h3 style="color:${color};">

                        ${sign}
                        ₹${item.amount.toLocaleString("en-IN")}

                    </h3>

                    <p>

        }).join("");

function sendAI() {

    const input =
        document.getElementById("aiInput");

    const question =
        input.value.trim();


    if (!question) {

        return;

    }


    askAI(question);

    input.value = "";

}


function askAI(question) {

    const box =
        document.getElementById("chatBox");


    if (!box) return;


    box.innerHTML += `

        <div class="chat-user">

            ${escapeHTML(question)}

        </div>

    `;


    let answer =
        "I can help with your LifeHub information.";

    const q =
        question.toLowerCase();


    if (
        q.includes("medicine") ||
        q.includes("medicines")
    ) {

        const medicines =
            getData("kkr_medicines");

        answer =
            "You have " +
            medicines.length +
            " medicine(s) saved.";

    }


    else if (
        q.includes("reminder") ||
        q.includes("reminders")
    ) {

        const reminders =
            getData("kkr_reminders");

        const pending =
            reminders.filter(function(item) {

                return !item.done;

            }).length;

        answer =
            "You have " +
            pending +
            " pending reminder(s).";

    }


    else if (
        q.includes("money") ||
        q.includes("balance")
    ) {

        const money =
            getData("kkr_money");

        let income = 0;
        let expense = 0;

        money.forEach(function(item) {

            if (item.type === "income") {

                income += item.amount;

            } else {

                expense += item.amount;

            }

        });

        answer =
            "Your current balance is ₹" +
            (income - expense).toLocaleString("en-IN") +
            ".";

    }


    else if (
        q.includes("family")
    ) {

        const family =
            getData("kkr_family");

        answer =
            "You have " +
            family.length +
            " family member(s) saved.";

    }


    else if (
        q.includes("hello") ||
        q.includes("hi")
    ) {

        answer =
            "Hello 👋 How can I help you today?";

    }


    box.innerHTML += `

        <div class="chat-ai">

            ${escapeHTML(answer)}

        </div>

    `;


    box.scrollTop =
        box.scrollHeight;

}

        "kkr_reminders",
        "kkr_family",
        "kkr_money",
        "kkr_profile"

    ];


    let totalItems = 0;


    keys.forEach(function(key) {

        try {

            const data =
                JSON.parse(
                    localStorage.getItem(key)
                );

            if (Array.isArray(data)) {

                totalItems += data.length;

            } else if (data) {

                totalItems++;

            }

        } catch (error) {}

    });


    navigate(
        "storage",
        `

        <div class="header">

            <h1>💾 Storage</h1>

            <p>
                LifeHub saved information
            </p>

        </div>


        <div class="container">


            <div class="stat-grid">

                <div class="stat">

                    <div class="stat-title">
                        Saved Items
                    </div>

                    <div class="stat-value">
                        ${totalItems}
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-title">
                        Storage
                    </div>

                    <div class="stat-value">
                        Local
                    </div>

                </div>

            </div>


            <div class="section-card">

                <h3>
                    💾 Local Storage
                </h3>

                <p>
                    Your current LifeHub data is stored
                    on this device/browser.
                </p>

            </div>


            <button class="back-button"
                    onclick="goBack()">

                ← Back

            </button>

        </div>

        `,
        push
    );

}

function exportBackup() {

    const backup = {

        app: "KKR LifeHub",

        version: "1.0",

        exportedAt:
            new Date().toISOString(),

        medicines:
            getData("kkr_medicines"),

        documents:
            getData("kkr_documents"),

        reminders:
            getData("kkr_reminders"),

        family:
            getData("kkr_family"),

        money:
            getData("kkr_money"),

        profile:
            getData(
                "kkr_profile",
                {}
            )

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type: "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        "KKR-LifeHub-Backup.json";


    link.click();


    URL.revokeObjectURL(url);


    showToast("Backup exported");

}


function restoreBackup() {

    const input =
        document.getElementById("restoreFile");


    if (
        !input ||
        !input.files ||
        !input.files[0]
    ) {

        showToast("Select a backup file");

        return;

    }


    const reader =
        new FileReader();


    reader.onload = function(event) {

        try {

            const backup =
                JSON.parse(
                    event.target.result
                );


            if (
                !backup ||
                backup.app !== "KKR LifeHub"
            ) {

                showToast("Invalid LifeHub backup");

                return;

            }


            saveData(
                "kkr_medicines",
                backup.medicines || []
            );

            saveData(
                "kkr_documents",
                backup.documents || []
            );

            saveData(
                "kkr_reminders",
                backup.reminders || []
            );

            saveData(
                "kkr_family",
                backup.family || []
            );

            saveData(
                "kkr_money",
                backup.money || []
            );

            saveData(
                "kkr_profile",
                backup.profile || {}
            );


            showToast(
                "Backup restored successfully"
            );


            setTimeout(
                showHome,
                800
            );

        } catch (error) {

            showToast(
                "Could not restore backup"
            );

        }

    };


    reader.readAsText(
        input.files[0]
    );

}

function clearAllData() {

    const answer =
        confirm(
            "This will delete all KKR LifeHub saved data. Continue?"
        );


    if (!answer) return;


    const keys = [

        "kkr_medicines",
        "kkr_documents",
        "kkr_reminders",
        "kkr_family",
        "kkr_money",
        "kkr_profile"

    ];


    keys.forEach(function(key) {

        localStorage.removeItem(key);

    });


    showToast(
        "LifeHub data cleared"
    );


    setTimeout(
        showHome,
        700
    );

}


/* =====================================================
   SAFE TEXT HELPERS
   ===================================================== */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


/* =====================================================
   THEME LOAD
   ===================================================== */

function loadSavedSettings() {

    const theme =
        localStorage.getItem(
            "kkr_theme"
        );


    if (theme === "dark") {

        document.body.classList.add("dark");

    }


    const font =
        localStorage.getItem(
            "kkr_font"
        );


    if (font === "small") {

        document.body.style.fontSize = "13px";

    }

    if (font === "medium") {

        document.body.style.fontSize = "14px";

    }

    if (font === "large") {

        document.body.style.fontSize = "16px";

    }

}
