    const hour = new Date().getHours();

    if (hour >= 5 && hour < 12) {
        return "Good Morning";

    if (hour >= 12 && hour < 17) {
        return "Good Afternoon";
    }

    if (hour >= 17 && hour < 21) {

}

            </button>

/* =========================
   MEDICINE SEARCH
   ========================= */

function searchMedicine() {

    const input =
        document.getElementById("medicineSearch");

    const results =
        document.getElementById("medicineResults");

    if (!input || !results) {
        return;
    }

    const value =
        input.value.trim();

    if (value === "") {

        results.innerHTML = `

            <div class="empty-medicine">

                <div>💊</div>

                <strong>
                    Search for a medicine
                </strong>

                <small>
                    Find a medicine from the catalogue
                </small>

            </div>

        `;

        return;
    }


    results.innerHTML = `

        <button class="medicine-result"
                onclick="selectMedicine('${value}')">

            <span>
                💊
            </span>

            <div>

                <strong>
                    ${value}
                </strong>

                <small>
                    Select this medicine
                </small>

            </div>

        </button>

    `;
}


function selectMedicine(name) {

    alert(

    );

}

<script>

/* =========================
   MEDICINE CATALOGUE
   ========================= */

const medicineCatalogue = [

    {
        name: "Amlodipine",
        type: "Tablet"
    },

    {
        name: "Metformin",
        type: "Tablet"
    },

    {
        name: "Losartan",
        type: "Tablet"
    },

    {
        name: "Omeprazole",
        type: "Capsule"
    },

    {
        name: "Pantoprazole",
        type: "Tablet"
    },

    {
        name: "Atorvastatin",
        type: "Tablet"
    },

    {
        name: "Paracetamol",
        type: "Tablet"
    },

    {
        name: "Cetirizine",
        type: "Tablet"
    }

];


/* =========================
   SEARCH CATALOGUE
   ========================= */

function searchMedicine() {

    const input =
        document.getElementById("medicineSearch");

    const results =
        document.getElementById("medicineResults");

    if (!input || !results) {
        return;
    }

    const value =
        input.value.trim().toLowerCase();


    if (value === "") {

        results.innerHTML = `

            <div class="empty-medicine">

                <div>💊</div>

                <strong>
                    Search for a medicine
                </strong>

                <small>
                    Find a medicine from the catalogue
                </small>

            </div>

        `;

        return;
    }


    const matches =
        medicineCatalogue.filter(function(medicine) {

            return medicine.name
                .toLowerCase()
                .includes(value);

        });


    if (matches.length === 0) {

        results.innerHTML = `

            <div class="empty-medicine">

                <div>🔍</div>

                <strong>
                    No medicine found
                </strong>

                <small>
                    Try another medicine name
                </small>

            </div>

        `;

        return;
    }


    results.innerHTML = matches.map(function(medicine) {

function deleteMedicine(id) {

    if (!confirmDelete) {
        return;
    }


    let medicines =
        JSON.parse(
            localStorage.getItem(
                "kkrMedicines"
            ) || "[]"
        );


    medicines =
        medicines.filter(function(medicine) {

            return medicine.id !== id;

        });


    localStorage.setItem(
        "kkrMedicines",
        JSON.stringify(medicines)
    );


    openMedicines();

/* =========================

   ========================= */

function updateMedicine(id) {

    let medicines =
        JSON.parse(
            localStorage.getItem(
                "kkrMedicines"
            ) || "[]"
        );


    medicines =
        medicines.map(function(medicine) {

            if (medicine.id === id) {

                medicine.dosage =
                    document.getElementById(
                        "editDosage"
                    ).value.trim();

                medicine.time =

   <script>

/* =========================
   LOAD SAVED DOCUMENTS
   ========================= */

function loadSavedDocuments() {

    const container =
        document.getElementById(
            "savedDocuments"
        );

    if (!container) {
        return;
    }


    const documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    const activeDocuments =
        documents.filter(function(document) {

            return !document.archived;

        });


    if (activeDocuments.length === 0) {

        container.innerHTML = `

            <div class="empty-medicine">

                <div>📄</div>

                <strong>
                    No documents added
                </strong>

                <small>
                    Your documents will appear here
                </small>

            </div>

        `;

        return;
    }


    container.innerHTML =
        activeDocuments.map(function(document) {

            let expiryText =
                "No expiry date";

            let expiryClass =
                "normal";


            if (document.expiryDate) {

                const today =
                    new Date();

                const expiry =
                    new Date(
                        document.expiryDate
                    );

                const difference =
                    expiry - today;

                const days =
                    Math.ceil(
                        difference /
                        (1000 * 60 * 60 * 24)
                    );


                if (days < 0) {

                    expiryText =
                        "Expired";

                    expiryClass =
                        "expired";

                } else if (days <= 30) {

                    expiryText =
                        "Expires in " +
                        days +
                        " days";

                    expiryClass =
                        "warning";

                } else {

                    expiryText =
                        "Expires: " +
                        document.expiryDate;

                }

            }


            return `

                <div class="document-list-card">


                    <div class="document-list-top">

                        <div class="document-list-icon">
                            📄
                        </div>


                        <div class="document-list-info">

                            <strong>
                                ${document.name}
                            </strong>

                            <small>
                                ${document.category}
                            </small>

                        </div>


                        <button
                            class="favorite-btn"
                            onclick="toggleDocumentFavorite(${document.id})">

                            ${document.favorite ? "⭐" : "☆"}

                        </button>

                    </div>


                    <div class="document-meta">

                        <span>
                            🗂️ ${document.category}
                        </span>

                        <span class="${expiryClass}">
                            📅 ${expiryText}
                        </span>

                    </div>


                    <div class="document-actions">

                        <button
                            onclick="editDocument(${document.id})">

                            ✏️ Edit

                        </button>


                        <button
                            onclick="archiveDocument(${document.id})">

                            📦 Archive

                        </button>


                        <button
                            onclick="deleteDocument(${document.id})">

                            🗑️ Delete

                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   FAVORITE DOCUMENT
   ========================= */

function toggleDocumentFavorite(id) {

    let documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    documents =
        documents.map(function(document) {

            if (document.id === id) {

                document.favorite =

            }

            return document;

        });


    localStorage.setItem(

/* =========================
   ARCHIVE DOCUMENT
   ========================= */

function archiveDocument(id) {

    let documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    documents =
        documents.map(function(document) {

            if (document.id === id) {

                document.archived = true;

            }

            return document;

        });


    localStorage.setItem(
        "kkrDocuments",
        JSON.stringify(documents)
    );


    openDocuments();

}


/* =========================
   DELETE DOCUMENT
   ========================= */

function deleteDocument(id) {

    if (
        !confirm(
            "Delete this document?"
        )
    ) {

        return;

    }


    let documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    documents =
        documents.filter(function(document) {

            return document.id !== id;

        });


    localStorage.setItem(
        "kkrDocuments",
        JSON.stringify(documents)
    );


    openDocuments();

}

/* =========================
   LOAD REMINDERS
   ========================= */

function loadReminders(filter = "all") {

    const container =
        document.getElementById(
            "reminderList"
        );

    if (!container) {
        return;
    }


    const reminders =
        JSON.parse(
            localStorage.getItem(
                "kkrReminders"
            ) || "[]"
        );


    let filtered =
        reminders;


    if (filter === "pending") {

        filtered =
            reminders.filter(function(reminder) {

                return !reminder.completed;

            });

    }


    if (filter === "completed") {

        filtered =
            reminders.filter(function(reminder) {

                return reminder.completed;

            });

    }


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="empty-medicine">

                <div>⏰</div>

                <strong>
                    No reminders found
                </strong>

                <small>
                    Your reminders will appear here
                </small>

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered.map(function(reminder) {

            return `

                <div class="reminder-card">

                    <div class="reminder-card-top">

                        <div class="reminder-icon">
                            ⏰
                        </div>


                        <div class="reminder-info">

                            <strong>
                                ${reminder.title}
                            </strong>

                            <small>
                                ${reminder.category || "General"}
                            </small>

                        </div>

                    </div>


                    <div class="reminder-details">

                        <span>
                            📅 ${reminder.date}
                        </span>

                        <span>
                            ⏰ ${reminder.time || "No time"}
                        </span>

                    </div>


                    ${
                        reminder.notes
                        ?
                        `
                        <div class="reminder-notes">
                            📝 ${reminder.notes}
                        </div>
                        `
                        :
                        ""
                    }


                    <div class="reminder-actions">

                        ${
                            reminder.completed

                            ?

                            `
                            <button
                                onclick="markReminderPending(${reminder.id})">

                                ↩️ Pending

                            </button>
                            `

                            :

                            `
                            <button
                                onclick="completeReminder(${reminder.id})">

                                ✅ Complete

                            </button>
                            `
                        }


                        <button
                            onclick="deleteReminder(${reminder.id})">

                            🗑️ Delete

                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   FILTER REMINDERS
   ========================= */

function showReminderList(filter) {

    loadReminders(filter);


    const buttons =
        document.querySelectorAll(
            ".reminder-filter-btn"
        );


    buttons.forEach(function(button) {

        button.classList.remove("active");

    });


    if (filter === "all") {
        buttons[0].classList.add("active");
    }


    if (filter === "pending") {
        buttons[1].classList.add("active");
    }


    if (filter === "completed") {
        buttons[2].classList.add("active");
    }

}


/* =========================
   COMPLETE REMINDER
   ========================= */

function completeReminder(id) {

    let reminders =
        JSON.parse(
            localStorage.getItem(
                "kkrReminders"
            ) || "[]"
        );


    reminders =
        reminders.map(function(reminder) {

            if (reminder.id === id) {

                reminder.completed = true;

            }

            return reminder;

        });


    localStorage.setItem(
        "kkrReminders",
        JSON.stringify(reminders)
    );


    loadReminders();

}


/* =========================
   MARK AS PENDING
   ========================= */

function markReminderPending(id) {

    let reminders =
        JSON.parse(
            localStorage.getItem(
                "kkrReminders"
            ) || "[]"
        );


    reminders =
        reminders.map(function(reminder) {

            if (reminder.id === id) {

                reminder.completed = false;

            }

            return reminder;

        });


    localStorage.setItem(
        "kkrReminders",
        JSON.stringify(reminders)
    );


    loadReminders();

}


/* =========================
   DELETE REMINDER
   ========================= */

function deleteReminder(id) {

    if (
        !confirm(
            "Delete this reminder?"
        )
    ) {

        return;

    }


    let reminders =
        JSON.parse(
            localStorage.getItem(
                "kkrReminders"
            ) || "[]"
        );


    reminders =
        reminders.filter(function(reminder) {

            return reminder.id !== id;

        });


    localStorage.setItem(
        "kkrReminders",
        JSON.stringify(reminders)
    );


    loadReminders();

}

   <script>

/* =========================
   LOAD PAYMENTS
   ========================= */

function loadPayments() {

    const container =
        document.getElementById(
            "paymentList"
        );

    if (!container) {
        return;
    }


    const payments =
        JSON.parse(
            localStorage.getItem(
                "kkrPayments"
            ) || "[]"
        );


    let income = 0;

    let expenses = 0;

    let pending = 0;


    payments.forEach(function(payment) {

        if (
            payment.type === "income" &&
            payment.status === "paid"
        ) {

            income += payment.amount;

        }


        if (
            payment.type === "expense" &&
            payment.status === "paid"
        ) {

            expenses += payment.amount;

        }


        if (
            payment.status === "pending"
        ) {

            pending += payment.amount;

        }

    });


    const balance =
        income - expenses;


    document.getElementById(
        "moneyBalance"
    ).textContent =
        formatMoney(balance);


    document.getElementById(
        "moneyIncome"
    ).textContent =
        formatMoney(income);


    document.getElementById(
        "moneyExpenses"
    ).textContent =
        formatMoney(expenses);


    document.getElementById(
        "moneyPending"
    ).textContent =
        formatMoney(pending);


    if (payments.length === 0) {

        container.innerHTML = `

            <div class="empty-medicine">

                <div>💰</div>

                <strong>
                    No payments added
                </strong>

                <small>
                    Your payment history will appear here
                </small>

            </div>

        `;

        return;

    }


    container.innerHTML =
        payments.map(function(payment) {

            const statusText =
                payment.status === "paid"
                ? "Paid"
                : "Pending";


            const statusClass =
                payment.status === "paid"
                ? "payment-paid"
                : "payment-pending";


            const typeIcon =
                payment.type === "income"
                ? "📈"
                : "💸";


            return `

                <div class="payment-card">

                    <div class="payment-card-top">

                        <div class="payment-icon">
                            ${typeIcon}
                        </div>


                        <div class="payment-info">

                            <strong>
                                ${payment.name}
                            </strong>

                            <small>
                                ${payment.category || "General"}
                            </small>

                        </div>


                        <div class="payment-amount
                            ${payment.type === "income"
                                ? "income-amount"
                                : "expense-amount"}">

                            ${
                                payment.type === "income"
                                ? "+"
                                : "-"
                            }

                            ${formatMoney(
                                payment.amount
                            )}

                        </div>

                    </div>


                    <div class="payment-details">

                        <span>
                            📅 ${payment.date}
                        </span>

                        <span class="${statusClass}">
                            ${statusText}
                        </span>

                    </div>


                    ${
                        payment.notes
                        ?
                        `
                        <div class="payment-notes">
                            📝 ${payment.notes}
                        </div>
                        `
                        :
                        ""
                    }


                    <div class="payment-actions">

                        <button
                            onclick="deletePayment(${payment.id})">

                            🗑️ Delete

                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   MONEY FORMAT
   ========================= */

function formatMoney(amount) {

    return "₹" +
        Number(amount).toLocaleString(
            "en-IN"
        );

}


/* =========================
   DELETE PAYMENT
   ========================= */

function deletePayment(id) {

    if (
        !confirm(
            "Delete this payment?"
        )
    ) {

        return;

    }


    let payments =
        JSON.parse(
            localStorage.getItem(
                "kkrPayments"
            ) || "[]"
        );


    payments =
        payments.filter(function(payment) {

            return payment.id !== id;

        });


    localStorage.setItem(
        "kkrPayments",
        JSON.stringify(payments)
    );


    openMoney();

}

</script>

    container.innerHTML =

            return `

/* =========================

   ========================= */

function markAlertRead(id) {

    let alerts =
        JSON.parse(
            localStorage.getItem(
                "kkrAlerts"
            ) || "[]"
        );


    alerts =
        alerts.map(function(alertData) {

            if (alertData.id === id) {

                alertData.read = true;

            }

            return alertData;

        });


    localStorage.setItem(
        "kkrAlerts",
        JSON.stringify(alerts)
    );


    loadAlerts();

}


/* =========================

   ========================= */

function deleteAlert(id) {

    if (
        !confirm(
            "Delete this alert?"
        )
    ) {

        return;

    }


    let alerts =
        JSON.parse(
            localStorage.getItem(
                "kkrAlerts"
            ) || "[]"
        );


    alerts =
        alerts.filter(function(alertData) {

            return alertData.id !== id;

    localStorage.setItem(
        "kkrAlerts",
        JSON.stringify(alerts)
    );


    loadAlerts();

}

        list.id =

        healthCard.parentNode.insertBefore(

        healthCard.parentNode.insertBefore(
            list,

        );


        loadEmergencyContacts();

function saveMeasurement() {

    const type =
        document.getElementById(

        ).value;


    const value =
        document.getElementById(

        ).value.trim();


    const unit =
        document.getElementById(

        type: type,

        value: value,

   <script>

/* =========================

   ========================= */

function loadMeasurements() {

    const list =
        document.getElementById(
            "measurementList"
        );

    if (!list) {
        return;
    }


    const measurements =
        JSON.parse(
            localStorage.getItem(
                "kkrMeasurements"
            ) || "[]"
        );


    if (measurements.length === 0) {

        list.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    📏
                </div>

                <h3>
                    No Measurements
                </h3>

        `;

        return;

    }


    list.innerHTML = `

        <div class="section-title">
            Saved Measurements
        </div>

    `;


    measurements
        .slice()
        .reverse()
        .forEach(function(measurement) {

            const card =
                document.createElement("div");

            card.className =
                "measurement-card";


            card.innerHTML = `

                <div class="measurement-top">

                    <div>

                        <h3>
                            ${measurement.type}
                        </h3>

                        <div class="measurement-value">

                    }

                        🗑️ Delete

                    </button>

                </div>

            `;


            list.appendChild(card);

        });

}


/* =========================
   DELETE MEASUREMENT
   ========================= */

function deleteMeasurement(id) {

    if (
        !confirm(
            "Delete this measurement?"
        )
    ) {
        return;
    }


    let measurements =
        JSON.parse(
            localStorage.getItem(
                "kkrMeasurements"
            ) || "[]"
        );


    measurements =
        measurements.filter(function(item) {

            return item.id !== id;

        });


    localStorage.setItem(
        "kkrMeasurements",
        JSON.stringify(measurements)
    );


    alert(
        "Measurement deleted."
    );


    openMeasurements();

}


/* =========================
   EDIT MEASUREMENT
   ========================= */

function editMeasurement(id) {

    const measurements =
        JSON.parse(
            localStorage.getItem(
                "kkrMeasurements"
            ) || "[]"
        );


    const measurement =
        measurements.find(function(item) {

            return item.id === id;

        });


    if (!measurement) {
        return;
    }


    document.getElementById("app").innerHTML = `

        <section class="home-section">

            <button class="back-button"
                    onclick="openMeasurements()">

                ← Back

            </button>

            </h1>


            <p class="page-subtitle">
                Update your saved measurement.
            </p>


            <label class="form-label">
                Measurement Type
            </label>

            <select
                class="form-input"
                id="editMeasurementType">

                <option value="Weight">
                    Weight
                </option>

                <option value="Blood Pressure">
                    Blood Pressure
                </option>

                <option value="Blood Sugar">
                    Blood Sugar
                </option>

                <option value="Temperature">
                    Temperature
                </option>

                <option value="Heart Rate">
                    Heart Rate
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label class="form-label">
                Value
            </label>

            <input
                class="form-input"
                id="editMeasurementValue"
                value="${measurement.value}">


            <label class="form-label">
                Unit
            </label>

            <input
                class="form-input"
                id="editMeasurementUnit"
                value="${measurement.unit || ""}">


            <label class="form-label">
                Date
            </label>

            <input
                class="form-input"
                id="editMeasurementDate"
                type="date"
                value="${measurement.date}">


            <label class="form-label">
                Time
            </label>

            <input
                class="form-input"
                id="editMeasurementTime"
                type="time"
                value="${measurement.time || ""}">


            <label class="form-label">
                Notes
            </label>

            <textarea
                class="form-input form-textarea"
                id="editMeasurementNotes">${measurement.notes || ""}</textarea>


            <button
                class="save-button"
                onclick="updateMeasurement(${measurement.id})">

                Update Measurement

            </button>

        </section>

    `;


    document.getElementById(
        "editMeasurementType"
    ).value = measurement.type;

}


/* =========================
   UPDATE MEASUREMENT
   ========================= */

function updateMeasurement(id) {

    let measurements =
        JSON.parse(
            localStorage.getItem(
                "kkrMeasurements"
            ) || "[]"
        );


    measurements =
        measurements.map(function(item) {

            if (item.id === id) {

                item.type =
                    document.getElementById(
                        "editMeasurementType"
                    ).value;


                item.value =
                    document.getElementById(
                        "editMeasurementValue"
                    ).value.trim();


                item.unit =
                    document.getElementById(
                        "editMeasurementUnit"
                    ).value.trim();


                item.date =
                    document.getElementById(
                        "editMeasurementDate"
                    ).value;


                item.time =
                    document.getElementById(
                        "editMeasurementTime"
                    ).value;


                item.notes =
                    document.getElementById(
                        "editMeasurementNotes"
                    ).value.trim();

            }


            return item;

        });


    localStorage.setItem(
        "kkrMeasurements",
        JSON.stringify(measurements)
    );


    alert(
        "Measurement updated successfully."
    );


    openMeasurements();

}

/* Load saved security settings */

function loadSecuritySettings() {

    const settings = JSON.parse(
        localStorage.getItem("kkrSecurity") || "{}"
    );

    document.getElementById("appLockToggle").checked =
        settings.appLock || false;

    document.getElementById("autoLockTime").value =
        settings.autoLock || "5";

}


/* Save security settings */

function saveSecuritySetting() {

    const settings = {

        appLock:
            document.getElementById("appLockToggle").checked,

        autoLock:
            document.getElementById("autoLockTime").value

    };

    localStorage.setItem(
        "kkrSecurity",
        JSON.stringify(settings)
    );

}


/* Set PIN */

function setAppPIN() {

    const pin = prompt(
        "Enter a 4-digit PIN:"
    );

    if (!pin) return;

    if (!/^[0-9]{4}$/.test(pin)) {

        alert(
            "Please enter exactly 4 digits."
        );

        return;

    }

    const settings = JSON.parse(
        localStorage.getItem("kkrSecurity") || "{}"
    );

    settings.pin = pin;

    localStorage.setItem(
        "kkrSecurity",
        JSON.stringify(settings)
    );

    alert("PIN saved successfully.");

}

                        </span>

                        <span>

                        </span>

                    <button

                        onclick="setTheme('system')">

                        </span>

                        <span>

                        </span>

                    </button>

                </strong>

                <p>
                    Your selected theme will be
                    saved on this device.
                </p>

            </div>

        </section>

    `;

    updateThemeButtons();

}


/* Set theme */

function setTheme(theme) {

    localStorage.setItem(
        "kkrTheme",
        theme
    );

    applyTheme();

    updateThemeButtons();

}


/* Apply saved theme */

function applyTheme() {

    const theme =
        localStorage.getItem("kkrTheme") || "light";


    if (theme === "dark") {

        document.body.classList.add("dark-theme");

    } else if (theme === "system") {

        if (
            window.matchMedia &&
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches
        ) {

            document.body.classList.add(
                "dark-theme"
            );

        } else {

            document.body.classList.remove(
                "dark-theme"
            );

        }

    } else {

        document.body.classList.remove(
            "dark-theme"
        );

    }

}


/* Highlight selected theme */

function updateThemeButtons() {

    const selected =
        localStorage.getItem("kkrTheme") || "light";

    document
        .querySelectorAll(".theme-option")
        .forEach(function(button) {

            button.classList.remove(
                "selected"
            );

            if (
                button.innerText
                    .toLowerCase()
                    .includes(selected)
            ) {

                button.classList.add(
                    "selected"
                );

            }

        });

}

</script>

                <button

                    📤 Restore Backup

                </button>

            <div class="backup-warning">

/* Create backup */

function backupLifeHubData() {

    const data = {

        profile:
            JSON.parse(
                localStorage.getItem("kkrProfile") || "null"
            ),

        medicines:
            JSON.parse(
                localStorage.getItem("kkrMedicines") || "[]"
            ),

        documents:
            JSON.parse(
                localStorage.getItem("kkrDocuments") || "[]"
            ),

        reminders:
            JSON.parse(
                localStorage.getItem("kkrReminders") || "[]"
            ),

        family:
            JSON.parse(
                localStorage.getItem("kkrFamily") || "[]"
            ),

        payments:
            JSON.parse(
                localStorage.getItem("kkrPayments") || "[]"
            ),

        alerts:
            JSON.parse(
                localStorage.getItem("kkrAlerts") || "[]"
            ),

        emergencyContacts:
            JSON.parse(
                localStorage.getItem(
                    "kkrEmergencyContacts"
                ) || "[]"
            ),

        healthRecords:
            JSON.parse(
                localStorage.getItem(
                    "kkrHealthRecords"
                ) || "[]"
            ),

        appointments:
            JSON.parse(
                localStorage.getItem(
                    "kkrAppointments"
                ) || "[]"
            ),

        measurements:
            JSON.parse(
                localStorage.getItem(
                    "kkrMeasurements"
                ) || "[]"
            ),

        emergencyHealth:
            JSON.parse(
                localStorage.getItem(
                    "kkrEmergencyHealth"
                ) || "null"
            ),

        security:
            JSON.parse(
                localStorage.getItem(
                    "kkrSecurity"
                ) || "{}"
            ),

        notificationSettings:
            JSON.parse(
                localStorage.getItem(
                    "kkrNotificationSettings"
                ) || "{}"
            ),

        theme:
            localStorage.getItem("kkrTheme") || "light",

        backupDate:
            new Date().toISOString()

    };


    const json = JSON.stringify(
        data,
        null,
        2
    );


    const blob = new Blob(
        [json],
        {
            type: "application/json"
        }
    );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        "KKR-LifeHub-Backup.json";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);


    alert(
        "KKR LifeHub backup created successfully."
    );

}


/* Restore backup */

function restoreLifeHubData(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            try {

                const data =
                    JSON.parse(e.target.result);


                if (
                    !data ||
                    typeof data !== "object"
                ) {

                    throw new Error(
                        "Invalid backup"
                    );

                }


                if (
                    !confirm(
                        "Restore this backup? Existing saved data may be replaced."
                    )
                ) {

                    return;

                }


                const keys = {

                    profile:
                        "kkrProfile",

                    medicines:
                        "kkrMedicines",

                    documents:
                        "kkrDocuments",

                    reminders:
                        "kkrReminders",

                    family:
                        "kkrFamily",

                    payments:
                        "kkrPayments",

                    alerts:
                        "kkrAlerts",

                    emergencyContacts:
                        "kkrEmergencyContacts",

                    healthRecords:
                        "kkrHealthRecords",

                    appointments:
                        "kkrAppointments",

                    measurements:
                        "kkrMeasurements",

                    emergencyHealth:
                        "kkrEmergencyHealth",

                    security:
                        "kkrSecurity",

                    notificationSettings:
                        "kkrNotificationSettings"

                };


                Object.keys(keys).forEach(
                    function(key) {

                        if (
                            data[key] !== undefined
                        ) {

                            localStorage.setItem(
                                keys[key],
                                JSON.stringify(
                                    data[key]
                                )
                            );

                        }

                    }
                );


                if (data.theme) {

                    localStorage.setItem(
                        "kkrTheme",
                        data.theme
                    );

                }


                applyTheme();


                alert(
                    "Backup restored successfully."
                );


                openSettings();

            }

            catch(error) {

                alert(
                    "Unable to restore this backup file."
                );

            }

        };


    reader.readAsText(file);

}

</script>

/* =========================

function sendAIMessage() {

    const input =
        document.getElementById("aiInput");

    if (!input) return;

    const message =
        input.value.trim();

    if (!message) return;


    addAIUserMessage(message);

    input.value = "";


    setTimeout(function() {

        const reply =
            getAIResponse(message);

        addAIBotMessage(reply);

    }, 500);

}


/* Add user message */

function addAIUserMessage(message) {

    const messages =
        document.getElementById("aiMessages");

    if (!messages) return;


    const messageBox =
        document.createElement("div");

    messageBox.className =
        "ai-message ai-message-user";

    messageBox.innerHTML = `
        <div>
            ${message}
        </div>
    `;


    messages.appendChild(messageBox);

    messages.scrollTop =
        messages.scrollHeight;

}


/* Add AI message */

function addAIBotMessage(message) {

    const messages =
        document.getElementById("aiMessages");

    if (!messages) return;


    const messageBox =
        document.createElement("div");

    messageBox.className =
        "ai-message ai-message-bot";

    messageBox.innerHTML = `

        <div class="ai-message-name">
            KKR AI
        </div>

        <div>
            ${message}
        </div>

    `;


    messages.appendChild(messageBox);

    messages.scrollTop =
        messages.scrollHeight;

}

function getAIResponse(message) {

    if (
        text.includes("hello") ||
        text.includes("hi") ||
        text.includes("hey")
    ) {

        return "Hello 👋 How can I help you with KKR LifeHub?";

    if (

    if (

    if (

   <script>

/* =========================
   KKR AI SAVED ITEMS
   ========================= */

function getSavedItemsResponse(message) {

    const text =
        message.toLowerCase();


    const medicines =
        JSON.parse(
            localStorage.getItem("kkrMedicines") || "[]"
        );


    const documents =
        JSON.parse(
            localStorage.getItem("kkrDocuments") || "[]"
        );


    const reminders =
        JSON.parse(
            localStorage.getItem("kkrReminders") || "[]"
        );


    const family =
        JSON.parse(
            localStorage.getItem("kkrFamily") || "[]"
        );


    const appointments =
        JSON.parse(
            localStorage.getItem("kkrAppointments") || "[]"
        );


    /* Medicines */

    if (
        text.includes("what medicine") ||
        text.includes("which medicine") ||
        text.includes("list medicine") ||
        text.includes("show medicine")
    ) {

        if (medicines.length === 0) {

            return "You don't have any saved medicines yet. 💊";

        }


        let result =
            "Here are your saved medicines: 💊<br><br>";


        medicines.forEach(function(medicine, index) {

            result +=
                (index + 1) +
                ". <strong>" +
                medicine.name +
                "</strong>";


            if (medicine.dosage) {

                result +=
                    " — " +
                    medicine.dosage;

            }


            result += "<br>";

        });


        return result;

    }


    /* Documents */

    if (
        text.includes("what document") ||
        text.includes("which document") ||
        text.includes("list document") ||
        text.includes("show document")
    ) {

        if (documents.length === 0) {

            return "You don't have any saved documents yet. 📄";

        }


        let result =
            "Here are your saved documents: 📄<br><br>";


        documents.forEach(function(document, index) {

            result +=
                (index + 1) +
                ". <strong>" +
                document.name +
                "</strong>";


            if (document.category) {

                result +=
                    " — " +
                    document.category;

            }


            result += "<br>";

        });


        return result;

    }


    /* Family */

    if (
        text.includes("family member") ||
        text.includes("family members") ||
        text.includes("show family")
    ) {

        if (family.length === 0) {

            return "You don't have any saved family members yet. 👨‍👩‍👧";

        }


        let result =
            "Here are your saved family members: 👨‍👩‍👧<br><br>";


        family.forEach(function(member, index) {

            result +=
                (index + 1) +
                ". <strong>" +
                member.name +
                "</strong>";


            if (member.relationship) {

                result +=
                    " — " +
                    member.relationship;

            }


            result += "<br>";

        });


        return result;

    }


    /* Appointments */

    if (
        text.includes("what appointment") ||
        text.includes("which appointment") ||
        text.includes("show appointment")
    ) {

        if (appointments.length === 0) {

            return "You don't have any saved appointments yet. 🏥";

        }


        let result =
            "Here are your saved appointments: 🏥<br><br>";


        appointments.forEach(function(appointment, index) {

            result +=
                (index + 1) +
                ". <strong>" +
                appointment.doctor +
                "</strong>";


            if (appointment.date) {

                result +=
                    " — " +
                    appointment.date;

            }


            if (appointment.time) {

                result +=
                    " " +
                    appointment.time;

            }


            result += "<br>";

        });


        return result;

    }


    return null;

}


/* Connect saved items to KKR AI */

const aiResponseBeforeSavedItems =
    getAIResponse;

getAIResponse = function(message) {

    const savedResponse =
        getSavedItemsResponse(message);


    if (savedResponse) {

   <script>

/* =========================
   KKR AI REMINDERS + MONEY
   ========================= */

function getReminderAndMoneyResponse(message) {

    const text =
        message.toLowerCase();


    const reminders =
        JSON.parse(
            localStorage.getItem("kkrReminders") || "[]"
        );


    const payments =
        JSON.parse(
            localStorage.getItem("kkrPayments") || "[]"
        );


    /* Reminders */

    if (
        text.includes("what reminder") ||
        text.includes("which reminder") ||
        text.includes("list reminder") ||
        text.includes("show reminder")
    ) {

        if (reminders.length === 0) {

            return "You don't have any saved reminders yet. 🔔";

        }


        let result =
            "Here are your saved reminders: 🔔<br><br>";


        reminders.forEach(function(reminder, index) {

            result +=
                (index + 1) +
                ". <strong>" +
                reminder.title +
                "</strong>";


            if (reminder.date) {

                result +=
                    " — " +
                    reminder.date;

            }


            if (reminder.time) {

                result +=
                    " " +
                    reminder.time;

            }


            if (reminder.completed) {

                result +=
                    " — Completed";

            } else {

                result +=
                    " — Pending";

            }


            result += "<br>";

        });


        return result;

    }


    /* Money */

    if (
        text.includes("recent payment") ||
        text.includes("my payments") ||
        text.includes("show payments")
    ) {

        if (payments.length === 0) {

            return "You don't have any saved payments yet. 💰";

        }


        let result =
            "Here are your recent payments: 💰<br><br>";


        const recentPayments =
            payments.slice(-5).reverse();


        recentPayments.forEach(function(payment, index) {

            const amount =
                Number(payment.amount) || 0;


            result +=
                (index + 1) +
                ". <strong>" +
                payment.name +
                "</strong>";


            result +=
                " — ₹" +
                amount.toLocaleString("en-IN");


            if (payment.type) {

                result +=
                    " — " +
                    payment.type;

            }


            if (payment.status) {

                result +=
                    " — " +
                    payment.status;

            }


            result += "<br>";

        });


        return result;

    }


    /* Expenses */

    if (
        text.includes("my expenses") ||
        text.includes("show expenses") ||
        text.includes("list expenses")
    ) {

        const expenses =
            payments.filter(function(payment) {

                return (
                    payment.type === "expense" &&
                    payment.status === "paid"
                );

            });


        if (expenses.length === 0) {

            return "You don't have any paid expenses saved yet. 💰";

        }


        let total = 0;


        expenses.forEach(function(payment) {

            total +=
                Number(payment.amount) || 0;

        });


        return `
Your recorded paid expenses are
<strong>₹${total.toLocaleString("en-IN")}</strong>. 💰
`;

    }


    return null;

}


/* Connect reminders and money */

const aiResponseBeforeReminderMoney =
    getAIResponse;

getAIResponse = function(message) {

    const response =
        getReminderAndMoneyResponse(message);


    if (response) {

        return response;

    }


    return aiResponseBeforeReminderMoney(message);

};

   <script>

/* =========================
   DOCUMENT EXPIRY STATUS
   ========================= */

function getDocumentExpiryStatus(expiryDate) {

    if (!expiryDate) {

        return {
            text: "No expiry date",
            className: "expiry-none"
        };

    }


    const today =
        new Date();

    today.setHours(
        0, 0, 0, 0
    );


    const expiry =
        new Date(
            expiryDate
        );

    expiry.setHours(
        0, 0, 0, 0
    );


    const difference =
        expiry.getTime() -
        today.getTime();


    const days =
        Math.ceil(
            difference /
            (1000 * 60 * 60 * 24)
        );


    if (days < 0) {

        return {
            text: "Expired",
            className: "expiry-expired"
        };

    }


    if (days <= 30) {

        return {
            text:
                "Expires in " +
                days +
                " days",
            className: "expiry-soon"
        };

    }


    return {
        text: "Valid",
        className: "expiry-valid"
    };

}


/* =========================
   ADD STATUS TO DOCUMENTS
   ========================= */

function updateDocumentExpiryStatus() {

    const documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    const cards =
        document.querySelectorAll(
            ".document-saved-card"
        );


    cards.forEach(function(card, index) {

        const documentItem =
            documents[index];

        if (!documentItem) return;

        if (!documentItem.expiryDate)
            return;


        const status =
            getDocumentExpiryStatus(
                documentItem.expiryDate
            );


        if (
            card.querySelector(
                ".document-expiry-status"
            )
        ) return;


        const statusElement =
            document.createElement(
                "div"
            );


        statusElement.className =
            "document-expiry-status " +
            status.className;


        statusElement.innerHTML =
            "📅 " +
            status.text;


        const details =
            card.querySelector(
                ".document-saved-details"
            );


        if (details) {

            details.appendChild(
                statusElement
            );

        }

    });

}


/* =========================
   CONNECT TO DOCUMENTS
   ========================= */

const originalLoadDocumentsForExpiry =
    loadSavedDocuments;

loadSavedDocuments = function() {

    originalLoadDocumentsForExpiry();

    setTimeout(function() {

        updateDocumentExpiryStatus();

    }, 0);

};

</script>

   ========================= */

const originalSearchMedicineImproved =
    searchMedicine;

searchMedicine = function() {

    const input =
        document.getElementById(
            "medicineSearch"
        );

    if (!input) return;


    const query =
        input.value
            .trim()
            .toLowerCase();


    const results =
        document.getElementById(
            "medicineSearchResults"
        );

    if (!results) return;


    if (!query) {

        results.innerHTML = "";

        return;

    }


    const matches =
        medicineCatalogue.filter(
            function(medicine) {

                const name =
                    (
                        medicine.name ||
                        ""
                    ).toLowerCase();

                const type =
                    (
                        medicine.type ||
                        ""
                    ).toLowerCase();

                return (
                    name.includes(query) ||
                    type.includes(query)
                );

            }
        );


    if (matches.length === 0) {

        results.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    🔎
                </div>

                <h3>
                    No Medicine Found
                </h3>

                <p>
                    Try another medicine name
                    or type.
                </p>

            </div>

        `;

        return;

    }


    results.innerHTML = "";


    matches.forEach(
        function(medicine) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "medicine-result-card";


            card.onclick =
                function() {

                    selectMedicine(
                        medicine.name
                    );

                };


            card.innerHTML = `

                <div
                    class="medicine-result-icon">
                    💊
                </div>

                <div
                    class="medicine-result-info">

                    <strong>
                        ${medicine.name}
                    </strong>

                    <span>
                        ${medicine.type}
                    </span>

                </div>

                <div
                    class="medicine-result-arrow">
                    →
                </div>

            `;


            results.appendChild(
                card
            );

        }
    );

};

        JSON.parse(
            localStorage.getItem(

    if (

   <script>

function applySavedThemeOnLoad() {

    const savedTheme =
        localStorage.getItem("kkrTheme");

    if (!savedTheme) {
        return;
    }

    if (savedTheme === "dark") {

        document.body.classList.add(
            "dark-theme"
        );

    } else if (savedTheme === "light") {

        document.body.classList.remove(
            "dark-theme"
        );

    } else if (savedTheme === "system") {

        const prefersDark =
            window.matchMedia &&
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

        if (prefersDark) {

            document.body.classList.add(
                "dark-theme"
            );

        } else {

            document.body.classList.remove(
                "dark-theme"
            );

        }

    }

}

window.addEventListener(
    "load",
    function() {

        applySavedThemeOnLoad();

    }
);

   </script>

   <script>

function updateHomeQuickActionCounts() {

    const medicines =
        JSON.parse(
            localStorage.getItem(
                "kkrMedicines"
            ) || "[]"
        );

    const documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );

    const reminders =
        JSON.parse(
            localStorage.getItem(
                "kkrReminders"
            ) || "[]"
        );

    const payments =
        JSON.parse(
            localStorage.getItem(
                "kkrPayments"
            ) || "[]"
        );

    const quickCards =
        document.querySelectorAll(
            ".quick-card"
        );

    quickCards.forEach(function(card) {

        const text =
            card.innerText.toLowerCase();

        let count = null;

        if (text.includes("medicine")) {
            count = medicines.length;
        }

        else if (text.includes("document")) {
            count = documents.length;
        }

        else if (text.includes("reminder")) {

            count =
                reminders.filter(
                    function(item) {
                        return item.completed !== true;
                    }
                ).length;

        }

        else if (text.includes("money")) {
            count = payments.length;
        }

        if (count === null) return;

        let badge =
            card.querySelector(
                ".quick-count"
            );

        if (!badge) {

            badge =
                document.createElement(
                    "span"
                );

            badge.className =
                "quick-count";

            card.appendChild(badge);

        }

        badge.innerHTML =
            count;

    });

}


const homeBeforeQuickCounts =
    showHome;

showHome = function() {

    homeBeforeQuickCounts();

    setTimeout(function() {

        updateHomeQuickActionCounts();

    }, 0);

};

function showHomeExpiringDocuments() {

    const homeSection =
        document.querySelector(".home-section");

    if (!homeSection) return;

    if (
        document.querySelector(
            ".home-expiring-documents"
        )
    ) return;

    const documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );

    const today =
        new Date();

    const expiring =
        documents.filter(function(doc) {

            if (!doc.expiryDate) {
                return false;
            }

            const expiry =
                new Date(
                    doc.expiryDate
                );

            const difference =
                expiry - today;

            const days =
                Math.ceil(
                    difference /
                    (1000 * 60 * 60 * 24)
                );

            return days <= 30;

        }).slice(0, 3);

    const section =
        document.createElement("div");

    section.className =
        "home-expiring-documents";

   <script>

function showHomeMoneySnapshot() {

    const homeSection =
        document.querySelector(".home-section");

    if (!homeSection) return;

    if (
        document.querySelector(
            ".home-money-snapshot"
        )
    ) return;

    const payments =
        JSON.parse(
            localStorage.getItem(
                "kkrPayments"
            ) || "[]"
        );

    let income = 0;
    let expenses = 0;
    let pending = 0;

    payments.forEach(function(payment) {

        const amount =
            Number(payment.amount) || 0;

        if (
            payment.status === "pending"
        ) {

            pending += amount;

        }

        if (
            payment.status === "paid" &&
            payment.type === "income"
        ) {

            income += amount;

        }

        if (
            payment.status === "paid" &&
            payment.type === "expense"
        ) {

            expenses += amount;

        }

    });

    const balance =
        income - expenses;

    const section =
        document.createElement("div");

    section.className =
        "home-money-snapshot";

    section.innerHTML = `

        <div class="home-money-header">

            <div>

                <div class="section-title">
                    Money Snapshot
                </div>

                <div class="home-money-subtitle">
                    Your current financial overview
                </div>

            </div>

            <button
                class="home-money-view"
                onclick="openMoney()">

                View Money

            </button>

        </div>

        <div class="home-money-grid">

            <div class="home-money-card">

                <span
                    class="home-money-icon">
                    💰
                </span>

                <span
                    class="home-money-label">
                    Balance
                </span>

                <strong>
                    ₹${balance.toLocaleString("en-IN")}
                </strong>

            </div>

            <div class="home-money-card">

                <span
                    class="home-money-icon">
                    ⏳
                </span>

                <span
                    class="home-money-label">
                    Pending
                </span>

                <strong>
                    ₹${pending.toLocaleString("en-IN")}
                </strong>

            </div>

            <div class="home-money-card">

                <span
                    class="home-money-icon">
                    📉
                </span>

                <span
                    class="home-money-label">
                    Expenses
                </span>

                <strong>
                    ₹${expenses.toLocaleString("en-IN")}
                </strong>

            </div>

        </div>

    `;

    const documents =
        document.querySelector(
            ".home-expiring-documents"
        );

    if (documents) {

        documents.insertAdjacentElement(
            "afterend",
            section
        );

    } else {

        homeSection.appendChild(
            section
        );

    }

}


const homeBeforeMoneySnapshot =

    setTimeout(function() {

   <script>

window.kkrPageHistory =
    window.kkrPageHistory || [];


function rememberLifeHubPage(pageName) {

    if (!pageName) return;

    const history =
        window.kkrPageHistory;

    if (
        history.length === 0 ||
        history[history.length - 1] !== pageName
    ) {

        history.push(pageName);

    }

    if (history.length > 20) {

        history.shift();

    }

}


function goBackInLifeHub() {

    const history =
        window.kkrPageHistory;

    if (history.length <= 1) {

        showHome();

        return;

    }

    history.pop();

    const previousPage =
        history[history.length - 1];

    if (
        previousPage &&
        typeof window[previousPage] ===
        "function"
    ) {

        window[previousPage]();

    } else {

        showHome();

    }

}


function setupLifeHubBackButton() {

    if (
        window.kkrBackButtonReady
    ) {
        return;
    }

    window.kkrBackButtonReady =
        true;

    window.addEventListener(
        "popstate",
        function() {

            goBackInLifeHub();

        }
    );

}


setupLifeHubBackButton();

   </script>

function showConnectionStatus() {

    let banner =
        document.querySelector(
            ".connection-status"
        );

    if (!banner) {

        banner =
            document.createElement("div");

        banner.className =
            "connection-status";

        document.body.appendChild(
            banner
        );

    }

    if (navigator.onLine) {

        banner.classList.remove(
            "connection-offline"
        );

        banner.innerHTML =
            "✓ Back online";

        banner.classList.add(
            "connection-online"
        );

        setTimeout(function() {

            banner.classList.remove(
                "connection-online"
            );

        }, 2500);

    } else {

        banner.classList.remove(
            "connection-online"
        );

        banner.classList.add(
            "connection-offline"
        );

        banner.innerHTML =
            "⚠ You are offline. Saved data is still available.";

    }

}


window.addEventListener(
    "online",
    function() {

        showConnectionStatus();

    }
);


window.addEventListener(
    "offline",
    function() {

        showConnectionStatus();

    }
);

</script>

   <script>

function safeLifeHubStorage(
    key,
    fallback
) {

    try {

        const saved =
            localStorage.getItem(key);

        if (saved === null) {
            return fallback;
        }

        return JSON.parse(saved);

    } catch (error) {

        console.warn(
            "KKR LifeHub storage issue:",
            key
        );

        return fallback;

    }

}


function checkLifeHubStorage() {

    const listKeys = [

        "kkrMedicines",
        "kkrDocuments",
        "kkrReminders",
        "kkrFamily",
        "kkrPayments",
        "kkrAlerts",
        "kkrHealthRecords",
        "kkrAppointments",
        "kkrMeasurements",
        "kkrEmergencyContacts"

    ];

    listKeys.forEach(
        function(key) {

            const data =
                safeLifeHubStorage(
                    key,
                    []
                );

            if (!Array.isArray(data)) {

                localStorage.setItem(
                    key,
                    JSON.stringify([])
                );

            }

        }
    );

}


window.addEventListener(
    "load",
    function() {

        checkLifeHubStorage();

    }
);

   </script>

   <script>

let kkrAutoLockTimer = null;


function startLifeHubAutoLock() {

    if (kkrAutoLockTimer) {

        clearTimeout(
            kkrAutoLockTimer
        );

        kkrAutoLockTimer = null;
    }

    const security =
        JSON.parse(
            localStorage.getItem(
                "kkrSecurity"
            ) || "{}"
        );

    if (
        security.appLock !== true ||
        !security.pin
    ) {
        return;
    }

    const minutes =
        Number(
            security.autoLock
        );

    if (
        !minutes ||
        minutes <= 0
    ) {
        return;
    }

    kkrAutoLockTimer =
        setTimeout(
            function() {

                sessionStorage.removeItem(
                    "kkrLifeHubUnlocked"
                );

                showLifeHubLockScreen();

            },
            minutes * 60 * 1000
        );

}


function resetLifeHubAutoLock() {

    if (
        sessionStorage.getItem(
            "kkrLifeHubUnlocked"
        ) !== "true"
    ) {
        return;
    }

    startLifeHubAutoLock();

}


function setupLifeHubAutoLock() {

    const events = [
        "click",
        "touchstart",
        "keydown"
    ];

    events.forEach(
        function(eventName) {

            document.addEventListener(
                eventName,
                function() {

                    resetLifeHubAutoLock();

                },
                {
                    passive: true
                }
            );

        }
    );

}

    }

    if (

/*
 Connect important LifeHub pages.
*/

function connectLifeHubPage(
    pageName
) {

    const pageFunction =
        window[
            pageName
        ];

    if (
        typeof pageFunction !==
        "function"
    ) {
        return;
    }

    if (
        pageFunction.__lifeHubNavigation
    ) {
        return;
    }

    const wrappedPage =
        function() {

            if (
                !window.kkrNavigationHistory.length ||
                window.kkrNavigationHistory[
                    window.kkrNavigationHistory.length - 1
                ] !== pageName
            ) {

                window.kkrNavigationHistory.push(
                    pageName
                );

                history.pushState(
                    {
                        lifeHubPage:
                            pageName
                    },
                    "",
                    "#"
                    + pageName
                );

            }

            pageFunction.apply(
                this,
                arguments
            );

            updateLifeHubBackButton();

        };

    wrappedPage.__lifeHubNavigation =
        true;

    window[
        pageName
    ] =
        wrappedPage;

}
