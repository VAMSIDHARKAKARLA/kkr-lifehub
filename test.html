    const hour = new Date().getHours();

    if (hour >= 5 && hour < 12) {
        return "Good Morning";

    if (hour >= 12 && hour < 17) {
        return "Good Afternoon";
    }

    if (hour >= 17 && hour < 21) {

}

            </button>

/* =========================
   MEDICINE SEARCH
   ========================= */

function searchMedicine() {

    const input =
        document.getElementById("medicineSearch");

    const results =
        document.getElementById("medicineResults");

    if (!input || !results) {
        return;
    }

    const value =
        input.value.trim();

    if (value === "") {

        results.innerHTML = `

            <div class="empty-medicine">

                <div>💊</div>

                <strong>
                    Search for a medicine
                </strong>

                <small>
                    Find a medicine from the catalogue
                </small>

            </div>

        `;

        return;
    }


    results.innerHTML = `

        <button class="medicine-result"
                onclick="selectMedicine('${value}')">

            <span>
                💊
            </span>

            <div>

                <strong>
                    ${value}
                </strong>

                <small>
                    Select this medicine
                </small>

            </div>

        </button>

    `;
}


function selectMedicine(name) {

    alert(

    );

}

<script>

/* =========================
   MEDICINE CATALOGUE
   ========================= */

const medicineCatalogue = [

    {
        name: "Amlodipine",
        type: "Tablet"
    },

    {
        name: "Metformin",
        type: "Tablet"
    },

    {
        name: "Losartan",
        type: "Tablet"
    },

    {
        name: "Omeprazole",
        type: "Capsule"
    },

    {
        name: "Pantoprazole",
        type: "Tablet"
    },

    {
        name: "Atorvastatin",
        type: "Tablet"
    },

    {
        name: "Paracetamol",
        type: "Tablet"
    },

    {
        name: "Cetirizine",
        type: "Tablet"
    }

];


/* =========================
   SEARCH CATALOGUE
   ========================= */

function searchMedicine() {

    const input =
        document.getElementById("medicineSearch");

    const results =
        document.getElementById("medicineResults");

    if (!input || !results) {
        return;
    }

    const value =
        input.value.trim().toLowerCase();


    if (value === "") {

        results.innerHTML = `

            <div class="empty-medicine">

                <div>💊</div>

                <strong>
                    Search for a medicine
                </strong>

                <small>
                    Find a medicine from the catalogue
                </small>

            </div>

        `;

        return;
    }


    const matches =
        medicineCatalogue.filter(function(medicine) {

            return medicine.name
                .toLowerCase()
                .includes(value);

        });


    if (matches.length === 0) {

        results.innerHTML = `

            <div class="empty-medicine">

                <div>🔍</div>

                <strong>
                    No medicine found
                </strong>

                <small>
                    Try another medicine name
                </small>

            </div>

        `;

        return;
    }


    results.innerHTML = matches.map(function(medicine) {

function deleteMedicine(id) {

    if (!confirmDelete) {
        return;
    }


    let medicines =
        JSON.parse(
            localStorage.getItem(
                "kkrMedicines"
            ) || "[]"
        );


    medicines =
        medicines.filter(function(medicine) {

            return medicine.id !== id;

        });


    localStorage.setItem(
        "kkrMedicines",
        JSON.stringify(medicines)
    );


    openMedicines();

/* =========================

   ========================= */

function updateMedicine(id) {

    let medicines =
        JSON.parse(
            localStorage.getItem(
                "kkrMedicines"
            ) || "[]"
        );


    medicines =
        medicines.map(function(medicine) {

            if (medicine.id === id) {

                medicine.dosage =
                    document.getElementById(
                        "editDosage"
                    ).value.trim();

                medicine.time =

        expiryDate: expiryDate,

        reminder: reminder,

        notes: notes,

        favorite: false,

        archived: false

    };


    const documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    documents.push(documentData);


    localStorage.setItem(
        "kkrDocuments",
        JSON.stringify(documents)
    );


    alert(
        "Document saved successfully."
    );


    openDocuments();

}

   <script>

/* =========================
   LOAD SAVED DOCUMENTS
   ========================= */

function loadSavedDocuments() {

    const container =
        document.getElementById(
            "savedDocuments"
        );

    if (!container) {
        return;
    }


    const documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    const activeDocuments =
        documents.filter(function(document) {

            return !document.archived;

        });


    if (activeDocuments.length === 0) {

        container.innerHTML = `

            <div class="empty-medicine">

                <div>📄</div>

                <strong>
                    No documents added
                </strong>

                <small>
                    Your documents will appear here
                </small>

            </div>

        `;

        return;
    }


    container.innerHTML =
        activeDocuments.map(function(document) {

            let expiryText =
                "No expiry date";

            let expiryClass =
                "normal";


            if (document.expiryDate) {

                const today =
                    new Date();

                const expiry =
                    new Date(
                        document.expiryDate
                    );

                const difference =
                    expiry - today;

                const days =
                    Math.ceil(
                        difference /
                        (1000 * 60 * 60 * 24)
                    );


                if (days < 0) {

                    expiryText =
                        "Expired";

                    expiryClass =
                        "expired";

                } else if (days <= 30) {

                    expiryText =
                        "Expires in " +
                        days +
                        " days";

                    expiryClass =
                        "warning";

                } else {

                    expiryText =
                        "Expires: " +
                        document.expiryDate;

                }

            }


            return `

                <div class="document-list-card">


                    <div class="document-list-top">

                        <div class="document-list-icon">
                            📄
                        </div>


                        <div class="document-list-info">

                            <strong>
                                ${document.name}
                            </strong>

                            <small>
                                ${document.category}
                            </small>

                        </div>


                        <button
                            class="favorite-btn"
                            onclick="toggleDocumentFavorite(${document.id})">

                            ${document.favorite ? "⭐" : "☆"}

                        </button>

                    </div>


                    <div class="document-meta">

                        <span>
                            🗂️ ${document.category}
                        </span>

                        <span class="${expiryClass}">
                            📅 ${expiryText}
                        </span>

                    </div>


                    <div class="document-actions">

                        <button
                            onclick="editDocument(${document.id})">

                            ✏️ Edit

                        </button>


                        <button
                            onclick="archiveDocument(${document.id})">

                            📦 Archive

                        </button>


                        <button
                            onclick="deleteDocument(${document.id})">

                            🗑️ Delete

                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   FAVORITE DOCUMENT
   ========================= */

function toggleDocumentFavorite(id) {

    let documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    documents =
        documents.map(function(document) {

            if (document.id === id) {

                document.favorite =
                    !document.favorite;

            }

            return document;

        });


    localStorage.setItem(
        "kkrDocuments",
        JSON.stringify(documents)
    );


    openDocuments();

}


/* =========================
   ARCHIVE DOCUMENT
   ========================= */

function archiveDocument(id) {

    let documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    documents =
        documents.map(function(document) {

            if (document.id === id) {

                document.archived = true;

            }

            return document;

        });


    localStorage.setItem(
        "kkrDocuments",
        JSON.stringify(documents)
    );


    openDocuments();

}


/* =========================
   DELETE DOCUMENT
   ========================= */

function deleteDocument(id) {

    if (
        !confirm(
            "Delete this document?"
        )
    ) {

        return;

    }


    let documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    documents =
        documents.filter(function(document) {

            return document.id !== id;

        });


    localStorage.setItem(
        "kkrDocuments",
        JSON.stringify(documents)
    );


    openDocuments();

}


/* =========================
   REFRESH DOCUMENT LIST
   ========================= */

const originalOpenDocuments =
    openDocuments;


openDocuments = function() {

    originalOpenDocuments();

    setTimeout(function() {

        loadSavedDocuments();

    }, 0);

};

</script>

                    document.category
                        .toLowerCase()
                        .includes(value)

                    (document.number || "")

                        .includes(value)
