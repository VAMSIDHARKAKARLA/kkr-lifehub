    const hour = new Date().getHours();

    if (hour >= 5 && hour < 12) {
        return "Good Morning";

    if (hour >= 12 && hour < 17) {
        return "Good Afternoon";
    }

    if (hour >= 17 && hour < 21) {

}

            </button>

/* =========================
   MEDICINE SEARCH
   ========================= */

function searchMedicine() {

    const input =
        document.getElementById("medicineSearch");

    const results =
        document.getElementById("medicineResults");

    if (!input || !results) {
        return;
    }

    const value =
        input.value.trim();

    if (value === "") {

        results.innerHTML = `

            <div class="empty-medicine">

                <div>💊</div>

                <strong>
                    Search for a medicine
                </strong>

                <small>
                    Find a medicine from the catalogue
                </small>

            </div>

        `;

        return;
    }


    results.innerHTML = `

        <button class="medicine-result"
                onclick="selectMedicine('${value}')">

            <span>
                💊
            </span>

            <div>

                <strong>
                    ${value}
                </strong>

                <small>
                    Select this medicine
                </small>

            </div>

        </button>

    `;
}


function selectMedicine(name) {

    alert(

    );

}

<script>

/* =========================
   MEDICINE CATALOGUE
   ========================= */

const medicineCatalogue = [

    {
        name: "Amlodipine",
        type: "Tablet"
    },

    {
        name: "Metformin",
        type: "Tablet"
    },

    {
        name: "Losartan",
        type: "Tablet"
    },

    {
        name: "Omeprazole",
        type: "Capsule"
    },

    {
        name: "Pantoprazole",
        type: "Tablet"
    },

    {
        name: "Atorvastatin",
        type: "Tablet"
    },

    {
        name: "Paracetamol",
        type: "Tablet"
    },

    {
        name: "Cetirizine",
        type: "Tablet"
    }

];


/* =========================
   SEARCH CATALOGUE
   ========================= */

function searchMedicine() {

    const input =
        document.getElementById("medicineSearch");

    const results =
        document.getElementById("medicineResults");

    if (!input || !results) {
        return;
    }

    const value =
        input.value.trim().toLowerCase();


    if (value === "") {

        results.innerHTML = `

            <div class="empty-medicine">

                <div>💊</div>

                <strong>
                    Search for a medicine
                </strong>

                <small>
                    Find a medicine from the catalogue
                </small>

            </div>

        `;

        return;
    }


    const matches =
        medicineCatalogue.filter(function(medicine) {

            return medicine.name
                .toLowerCase()
                .includes(value);

        });


    if (matches.length === 0) {

        results.innerHTML = `

            <div class="empty-medicine">

                <div>🔍</div>

                <strong>
                    No medicine found
                </strong>

                <small>
                    Try another medicine name
                </small>

            </div>

        `;

        return;
    }


    results.innerHTML = matches.map(function(medicine) {

function deleteMedicine(id) {

    if (!confirmDelete) {
        return;
    }


    let medicines =
        JSON.parse(
            localStorage.getItem(
                "kkrMedicines"
            ) || "[]"
        );


    medicines =
        medicines.filter(function(medicine) {

            return medicine.id !== id;

        });


    localStorage.setItem(
        "kkrMedicines",
        JSON.stringify(medicines)
    );


    openMedicines();

/* =========================

   ========================= */

function updateMedicine(id) {

    let medicines =
        JSON.parse(
            localStorage.getItem(
                "kkrMedicines"
            ) || "[]"
        );


    medicines =
        medicines.map(function(medicine) {

            if (medicine.id === id) {

                medicine.dosage =
                    document.getElementById(
                        "editDosage"
                    ).value.trim();

                medicine.time =

   <script>

/* =========================
   LOAD SAVED DOCUMENTS
   ========================= */

function loadSavedDocuments() {

    const container =
        document.getElementById(
            "savedDocuments"
        );

    if (!container) {
        return;
    }


    const documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    const activeDocuments =
        documents.filter(function(document) {

            return !document.archived;

        });


    if (activeDocuments.length === 0) {

        container.innerHTML = `

            <div class="empty-medicine">

                <div>📄</div>

                <strong>
                    No documents added
                </strong>

                <small>
                    Your documents will appear here
                </small>

            </div>

        `;

        return;
    }


    container.innerHTML =
        activeDocuments.map(function(document) {

            let expiryText =
                "No expiry date";

            let expiryClass =
                "normal";


            if (document.expiryDate) {

                const today =
                    new Date();

                const expiry =
                    new Date(
                        document.expiryDate
                    );

                const difference =
                    expiry - today;

                const days =
                    Math.ceil(
                        difference /
                        (1000 * 60 * 60 * 24)
                    );


                if (days < 0) {

                    expiryText =
                        "Expired";

                    expiryClass =
                        "expired";

                } else if (days <= 30) {

                    expiryText =
                        "Expires in " +
                        days +
                        " days";

                    expiryClass =
                        "warning";

                } else {

                    expiryText =
                        "Expires: " +
                        document.expiryDate;

                }

            }


            return `

                <div class="document-list-card">


                    <div class="document-list-top">

                        <div class="document-list-icon">
                            📄
                        </div>


                        <div class="document-list-info">

                            <strong>
                                ${document.name}
                            </strong>

                            <small>
                                ${document.category}
                            </small>

                        </div>


                        <button
                            class="favorite-btn"
                            onclick="toggleDocumentFavorite(${document.id})">

                            ${document.favorite ? "⭐" : "☆"}

                        </button>

                    </div>


                    <div class="document-meta">

                        <span>
                            🗂️ ${document.category}
                        </span>

                        <span class="${expiryClass}">
                            📅 ${expiryText}
                        </span>

                    </div>


                    <div class="document-actions">

                        <button
                            onclick="editDocument(${document.id})">

                            ✏️ Edit

                        </button>


                        <button
                            onclick="archiveDocument(${document.id})">

                            📦 Archive

                        </button>


                        <button
                            onclick="deleteDocument(${document.id})">

                            🗑️ Delete

                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   FAVORITE DOCUMENT
   ========================= */

function toggleDocumentFavorite(id) {

    let documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    documents =
        documents.map(function(document) {

            if (document.id === id) {

                document.favorite =

            }

            return document;

        });


    localStorage.setItem(

/* =========================
   ARCHIVE DOCUMENT
   ========================= */

function archiveDocument(id) {

    let documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    documents =
        documents.map(function(document) {

            if (document.id === id) {

                document.archived = true;

            }

            return document;

        });


    localStorage.setItem(
        "kkrDocuments",
        JSON.stringify(documents)
    );


    openDocuments();

}


/* =========================
   DELETE DOCUMENT
   ========================= */

function deleteDocument(id) {

    if (
        !confirm(
            "Delete this document?"
        )
    ) {

        return;

    }


    let documents =
        JSON.parse(
            localStorage.getItem(
                "kkrDocuments"
            ) || "[]"
        );


    documents =
        documents.filter(function(document) {

            return document.id !== id;

        });


    localStorage.setItem(
        "kkrDocuments",
        JSON.stringify(documents)
    );


    openDocuments();

}

/* =========================
   LOAD REMINDERS
   ========================= */

function loadReminders(filter = "all") {

    const container =
        document.getElementById(
            "reminderList"
        );

    if (!container) {
        return;
    }


    const reminders =
        JSON.parse(
            localStorage.getItem(
                "kkrReminders"
            ) || "[]"
        );


    let filtered =
        reminders;


    if (filter === "pending") {

        filtered =
            reminders.filter(function(reminder) {

                return !reminder.completed;

            });

    }


    if (filter === "completed") {

        filtered =
            reminders.filter(function(reminder) {

                return reminder.completed;

            });

    }


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="empty-medicine">

                <div>⏰</div>

                <strong>
                    No reminders found
                </strong>

                <small>
                    Your reminders will appear here
                </small>

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered.map(function(reminder) {

            return `

                <div class="reminder-card">

                    <div class="reminder-card-top">

                        <div class="reminder-icon">
                            ⏰
                        </div>


                        <div class="reminder-info">

                            <strong>
                                ${reminder.title}
                            </strong>

                            <small>
                                ${reminder.category || "General"}
                            </small>

                        </div>

                    </div>


                    <div class="reminder-details">

                        <span>
                            📅 ${reminder.date}
                        </span>

                        <span>
                            ⏰ ${reminder.time || "No time"}
                        </span>

                    </div>


                    ${
                        reminder.notes
                        ?
                        `
                        <div class="reminder-notes">
                            📝 ${reminder.notes}
                        </div>
                        `
                        :
                        ""
                    }


                    <div class="reminder-actions">

                        ${
                            reminder.completed

                            ?

                            `
                            <button
                                onclick="markReminderPending(${reminder.id})">

                                ↩️ Pending

                            </button>
                            `

                            :

                            `
                            <button
                                onclick="completeReminder(${reminder.id})">

                                ✅ Complete

                            </button>
                            `
                        }


                        <button
                            onclick="deleteReminder(${reminder.id})">

                            🗑️ Delete

                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   FILTER REMINDERS
   ========================= */

function showReminderList(filter) {

    loadReminders(filter);


    const buttons =
        document.querySelectorAll(
            ".reminder-filter-btn"
        );


    buttons.forEach(function(button) {

        button.classList.remove("active");

    });


    if (filter === "all") {
        buttons[0].classList.add("active");
    }


    if (filter === "pending") {
        buttons[1].classList.add("active");
    }


    if (filter === "completed") {
        buttons[2].classList.add("active");
    }

}


/* =========================
   COMPLETE REMINDER
   ========================= */

function completeReminder(id) {

    let reminders =
        JSON.parse(
            localStorage.getItem(
                "kkrReminders"
            ) || "[]"
        );


    reminders =
        reminders.map(function(reminder) {

            if (reminder.id === id) {

                reminder.completed = true;

            }

            return reminder;

        });


    localStorage.setItem(
        "kkrReminders",
        JSON.stringify(reminders)
    );


    loadReminders();

}


/* =========================
   MARK AS PENDING
   ========================= */

function markReminderPending(id) {

    let reminders =
        JSON.parse(
            localStorage.getItem(
                "kkrReminders"
            ) || "[]"
        );


    reminders =
        reminders.map(function(reminder) {

            if (reminder.id === id) {

                reminder.completed = false;

            }

            return reminder;

        });


    localStorage.setItem(
        "kkrReminders",
        JSON.stringify(reminders)
    );


    loadReminders();

}


/* =========================
   DELETE REMINDER
   ========================= */

function deleteReminder(id) {

    if (
        !confirm(
            "Delete this reminder?"
        )
    ) {

        return;

    }


    let reminders =
        JSON.parse(
            localStorage.getItem(
                "kkrReminders"
            ) || "[]"
        );


    reminders =
        reminders.filter(function(reminder) {

            return reminder.id !== id;

        });


    localStorage.setItem(
        "kkrReminders",
        JSON.stringify(reminders)
    );


    loadReminders();

}

   <script>

/* =========================
   LOAD PAYMENTS
   ========================= */

function loadPayments() {

    const container =
        document.getElementById(
            "paymentList"
        );

    if (!container) {
        return;
    }


    const payments =
        JSON.parse(
            localStorage.getItem(
                "kkrPayments"
            ) || "[]"
        );


    let income = 0;

    let expenses = 0;

    let pending = 0;


    payments.forEach(function(payment) {

        if (
            payment.type === "income" &&
            payment.status === "paid"
        ) {

            income += payment.amount;

        }


        if (
            payment.type === "expense" &&
            payment.status === "paid"
        ) {

            expenses += payment.amount;

        }


        if (
            payment.status === "pending"
        ) {

            pending += payment.amount;

        }

    });


    const balance =
        income - expenses;


    document.getElementById(
        "moneyBalance"
    ).textContent =
        formatMoney(balance);


    document.getElementById(
        "moneyIncome"
    ).textContent =
        formatMoney(income);


    document.getElementById(
        "moneyExpenses"
    ).textContent =
        formatMoney(expenses);


    document.getElementById(
        "moneyPending"
    ).textContent =
        formatMoney(pending);


    if (payments.length === 0) {

        container.innerHTML = `

            <div class="empty-medicine">

                <div>💰</div>

                <strong>
                    No payments added
                </strong>

                <small>
                    Your payment history will appear here
                </small>

            </div>

        `;

        return;

    }


    container.innerHTML =
        payments.map(function(payment) {

            const statusText =
                payment.status === "paid"
                ? "Paid"
                : "Pending";


            const statusClass =
                payment.status === "paid"
                ? "payment-paid"
                : "payment-pending";


            const typeIcon =
                payment.type === "income"
                ? "📈"
                : "💸";


            return `

                <div class="payment-card">

                    <div class="payment-card-top">

                        <div class="payment-icon">
                            ${typeIcon}
                        </div>


                        <div class="payment-info">

                            <strong>
                                ${payment.name}
                            </strong>

                            <small>
                                ${payment.category || "General"}
                            </small>

                        </div>


                        <div class="payment-amount
                            ${payment.type === "income"
                                ? "income-amount"
                                : "expense-amount"}">

                            ${
                                payment.type === "income"
                                ? "+"
                                : "-"
                            }

                            ${formatMoney(
                                payment.amount
                            )}

                        </div>

                    </div>


                    <div class="payment-details">

                        <span>
                            📅 ${payment.date}
                        </span>

                        <span class="${statusClass}">
                            ${statusText}
                        </span>

                    </div>


                    ${
                        payment.notes
                        ?
                        `
                        <div class="payment-notes">
                            📝 ${payment.notes}
                        </div>
                        `
                        :
                        ""
                    }


                    <div class="payment-actions">

                        <button
                            onclick="deletePayment(${payment.id})">

                            🗑️ Delete

                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   MONEY FORMAT
   ========================= */

function formatMoney(amount) {

    return "₹" +
        Number(amount).toLocaleString(
            "en-IN"
        );

}


/* =========================
   DELETE PAYMENT
   ========================= */

function deletePayment(id) {

    if (
        !confirm(
            "Delete this payment?"
        )
    ) {

        return;

    }


    let payments =
        JSON.parse(
            localStorage.getItem(
                "kkrPayments"
            ) || "[]"
        );


    payments =
        payments.filter(function(payment) {

            return payment.id !== id;

        });


    localStorage.setItem(
        "kkrPayments",
        JSON.stringify(payments)
    );


    openMoney();

}

</script>

    container.innerHTML =

            return `

/* =========================

   ========================= */

function markAlertRead(id) {

    let alerts =
        JSON.parse(
            localStorage.getItem(
                "kkrAlerts"
            ) || "[]"
        );


    alerts =
        alerts.map(function(alertData) {

            if (alertData.id === id) {

                alertData.read = true;

            }

            return alertData;

        });


    localStorage.setItem(
        "kkrAlerts",
        JSON.stringify(alerts)
    );


    loadAlerts();

}


/* =========================

   ========================= */

function deleteAlert(id) {

    if (
        !confirm(
            "Delete this alert?"
        )
    ) {

        return;

    }


    let alerts =
        JSON.parse(
            localStorage.getItem(
                "kkrAlerts"
            ) || "[]"
        );


    alerts =
        alerts.filter(function(alertData) {

            return alertData.id !== id;

    localStorage.setItem(
        "kkrAlerts",
        JSON.stringify(alerts)
    );


    loadAlerts();

}

        list.id =

        healthCard.parentNode.insertBefore(

        healthCard.parentNode.insertBefore(
            list,

        );


        loadEmergencyContacts();

function saveMeasurement() {

    const type =
        document.getElementById(

        ).value;


    const value =
        document.getElementById(

        ).value.trim();


    const unit =
        document.getElementById(

        type: type,

        value: value,

   <script>

/* =========================

   ========================= */

function loadMeasurements() {

    const list =
        document.getElementById(
            "measurementList"
        );

    if (!list) {
        return;
    }


    const measurements =
        JSON.parse(
            localStorage.getItem(
                "kkrMeasurements"
            ) || "[]"
        );


    if (measurements.length === 0) {

        list.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    📏
                </div>

                <h3>
                    No Measurements
                </h3>

        `;

        return;

    }


    list.innerHTML = `

        <div class="section-title">
            Saved Measurements
        </div>

    `;


    measurements
        .slice()
        .reverse()
        .forEach(function(measurement) {

            const card =
                document.createElement("div");

            card.className =
                "measurement-card";


            card.innerHTML = `

                <div class="measurement-top">

                    <div>

                        <h3>
                            ${measurement.type}
                        </h3>

                        <div class="measurement-value">

                    }

                        🗑️ Delete

                    </button>

                </div>

            `;


            list.appendChild(card);

        });

}


/* =========================
   DELETE MEASUREMENT
   ========================= */

function deleteMeasurement(id) {

    if (
        !confirm(
            "Delete this measurement?"
        )
    ) {
        return;
    }


    let measurements =
        JSON.parse(
            localStorage.getItem(
                "kkrMeasurements"
            ) || "[]"
        );


    measurements =
        measurements.filter(function(item) {

            return item.id !== id;

        });


    localStorage.setItem(
        "kkrMeasurements",
        JSON.stringify(measurements)
    );


    alert(
        "Measurement deleted."
    );


    openMeasurements();

}


/* =========================
   EDIT MEASUREMENT
   ========================= */

function editMeasurement(id) {

    const measurements =
        JSON.parse(
            localStorage.getItem(
                "kkrMeasurements"
            ) || "[]"
        );


    const measurement =
        measurements.find(function(item) {

            return item.id === id;

        });


    if (!measurement) {
        return;
    }


    document.getElementById("app").innerHTML = `

        <section class="home-section">

            <button class="back-button"
                    onclick="openMeasurements()">

                ← Back

            </button>

            </h1>


            <p class="page-subtitle">
                Update your saved measurement.
            </p>


            <label class="form-label">
                Measurement Type
            </label>

            <select
                class="form-input"
                id="editMeasurementType">

                <option value="Weight">
                    Weight
                </option>

                <option value="Blood Pressure">
                    Blood Pressure
                </option>

                <option value="Blood Sugar">
                    Blood Sugar
                </option>

                <option value="Temperature">
                    Temperature
                </option>

                <option value="Heart Rate">
                    Heart Rate
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label class="form-label">
                Value
            </label>

            <input
                class="form-input"
                id="editMeasurementValue"
                value="${measurement.value}">


            <label class="form-label">
                Unit
            </label>

            <input
                class="form-input"
                id="editMeasurementUnit"
                value="${measurement.unit || ""}">


            <label class="form-label">
                Date
            </label>

            <input
                class="form-input"
                id="editMeasurementDate"
                type="date"
                value="${measurement.date}">


            <label class="form-label">
                Time
            </label>

            <input
                class="form-input"
                id="editMeasurementTime"
                type="time"
                value="${measurement.time || ""}">


            <label class="form-label">
                Notes
            </label>

            <textarea
                class="form-input form-textarea"
                id="editMeasurementNotes">${measurement.notes || ""}</textarea>


            <button
                class="save-button"
                onclick="updateMeasurement(${measurement.id})">

                Update Measurement

            </button>

        </section>

    `;


    document.getElementById(
        "editMeasurementType"
    ).value = measurement.type;

}


/* =========================
   UPDATE MEASUREMENT
   ========================= */

function updateMeasurement(id) {

    let measurements =
        JSON.parse(
            localStorage.getItem(
                "kkrMeasurements"
            ) || "[]"
        );


    measurements =
        measurements.map(function(item) {

            if (item.id === id) {

                item.type =
                    document.getElementById(
                        "editMeasurementType"
                    ).value;


                item.value =
                    document.getElementById(
                        "editMeasurementValue"
                    ).value.trim();


                item.unit =
                    document.getElementById(
                        "editMeasurementUnit"
                    ).value.trim();


                item.date =
                    document.getElementById(
                        "editMeasurementDate"
                    ).value;


                item.time =
                    document.getElementById(
                        "editMeasurementTime"
                    ).value;


                item.notes =
                    document.getElementById(
                        "editMeasurementNotes"
                    ).value.trim();

            }


            return item;

        });


    localStorage.setItem(
        "kkrMeasurements",
        JSON.stringify(measurements)
    );


    alert(
        "Measurement updated successfully."
    );


    openMeasurements();

}

/* Load saved security settings */

function loadSecuritySettings() {

    const settings = JSON.parse(
        localStorage.getItem("kkrSecurity") || "{}"
    );

    document.getElementById("appLockToggle").checked =
        settings.appLock || false;

    document.getElementById("autoLockTime").value =
        settings.autoLock || "5";

}


/* Save security settings */

function saveSecuritySetting() {

    const settings = {

        appLock:
            document.getElementById("appLockToggle").checked,

        autoLock:
            document.getElementById("autoLockTime").value

    };

    localStorage.setItem(
        "kkrSecurity",
        JSON.stringify(settings)
    );

}


/* Set PIN */

function setAppPIN() {

    const pin = prompt(
        "Enter a 4-digit PIN:"
    );

    if (!pin) return;

    if (!/^[0-9]{4}$/.test(pin)) {

        alert(
            "Please enter exactly 4 digits."
        );

        return;

    }

    const settings = JSON.parse(
        localStorage.getItem("kkrSecurity") || "{}"
    );

    settings.pin = pin;

    localStorage.setItem(
        "kkrSecurity",
        JSON.stringify(settings)
    );

    alert("PIN saved successfully.");

}

                        </span>

                        <span>

                        </span>

                    <button

                        onclick="setTheme('system')">

                        </span>

                        <span>

                        </span>

                    </button>

                </strong>

                <p>
                    Your selected theme will be
                    saved on this device.
                </p>

            </div>

        </section>

    `;

    updateThemeButtons();

}


/* Set theme */

function setTheme(theme) {

    localStorage.setItem(
        "kkrTheme",
        theme
    );

    applyTheme();

    updateThemeButtons();

}


/* Apply saved theme */

function applyTheme() {

    const theme =
        localStorage.getItem("kkrTheme") || "light";


    if (theme === "dark") {

        document.body.classList.add("dark-theme");

    } else if (theme === "system") {

        if (
            window.matchMedia &&
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches
        ) {

            document.body.classList.add(
                "dark-theme"
            );

        } else {

            document.body.classList.remove(
                "dark-theme"
            );

        }

    } else {

        document.body.classList.remove(
            "dark-theme"
        );

    }

}


/* Highlight selected theme */

function updateThemeButtons() {

    const selected =
        localStorage.getItem("kkrTheme") || "light";

    document
        .querySelectorAll(".theme-option")
        .forEach(function(button) {

            button.classList.remove(
                "selected"
            );

            if (
                button.innerText
                    .toLowerCase()
                    .includes(selected)
            ) {

                button.classList.add(
                    "selected"
                );

            }

        });

}

</script>

                <button

                    📤 Restore Backup

                </button>

            <div class="backup-warning">

/* Create backup */

function backupLifeHubData() {

    const data = {

        profile:
            JSON.parse(
                localStorage.getItem("kkrProfile") || "null"
            ),

        medicines:
            JSON.parse(
                localStorage.getItem("kkrMedicines") || "[]"
            ),

        documents:
            JSON.parse(
                localStorage.getItem("kkrDocuments") || "[]"
            ),

        reminders:
            JSON.parse(
                localStorage.getItem("kkrReminders") || "[]"
            ),

        family:
            JSON.parse(
                localStorage.getItem("kkrFamily") || "[]"
            ),

        payments:
            JSON.parse(
                localStorage.getItem("kkrPayments") || "[]"
            ),

        alerts:
            JSON.parse(
                localStorage.getItem("kkrAlerts") || "[]"
            ),

        emergencyContacts:
            JSON.parse(
                localStorage.getItem(
                    "kkrEmergencyContacts"
                ) || "[]"
            ),

        healthRecords:
            JSON.parse(
                localStorage.getItem(
                    "kkrHealthRecords"
                ) || "[]"
            ),

        appointments:
            JSON.parse(
                localStorage.getItem(
                    "kkrAppointments"
                ) || "[]"
            ),

        measurements:
            JSON.parse(
                localStorage.getItem(
                    "kkrMeasurements"
                ) || "[]"
            ),

        emergencyHealth:
            JSON.parse(
                localStorage.getItem(
                    "kkrEmergencyHealth"
                ) || "null"
            ),

        security:
            JSON.parse(
                localStorage.getItem(
                    "kkrSecurity"
                ) || "{}"
            ),

        notificationSettings:
            JSON.parse(
                localStorage.getItem(
                    "kkrNotificationSettings"
                ) || "{}"
            ),

        theme:
            localStorage.getItem("kkrTheme") || "light",

        backupDate:
            new Date().toISOString()

    };


    const json = JSON.stringify(
        data,
        null,
        2
    );


    const blob = new Blob(
        [json],
        {
            type: "application/json"
        }
    );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        "KKR-LifeHub-Backup.json";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);


    alert(
        "KKR LifeHub backup created successfully."
    );

}


/* Restore backup */

function restoreLifeHubData(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            try {

                const data =
                    JSON.parse(e.target.result);


                if (
                    !data ||
                    typeof data !== "object"
                ) {

                    throw new Error(
                        "Invalid backup"
                    );

                }


                if (
                    !confirm(
                        "Restore this backup? Existing saved data may be replaced."
                    )
                ) {

                    return;

                }


                const keys = {

                    profile:
                        "kkrProfile",

                    medicines:
                        "kkrMedicines",

                    documents:
                        "kkrDocuments",

                    reminders:
                        "kkrReminders",

                    family:
                        "kkrFamily",

                    payments:
                        "kkrPayments",

                    alerts:
                        "kkrAlerts",

                    emergencyContacts:
                        "kkrEmergencyContacts",

                    healthRecords:
                        "kkrHealthRecords",

                    appointments:
                        "kkrAppointments",

                    measurements:
                        "kkrMeasurements",

                    emergencyHealth:
                        "kkrEmergencyHealth",

                    security:
                        "kkrSecurity",

                    notificationSettings:
                        "kkrNotificationSettings"

                };


                Object.keys(keys).forEach(
                    function(key) {

                        if (
                            data[key] !== undefined
                        ) {

                            localStorage.setItem(
                                keys[key],
                                JSON.stringify(
                                    data[key]
                                )
                            );

                        }

                    }
                );


                if (data.theme) {

                    localStorage.setItem(
                        "kkrTheme",
                        data.theme
                    );

                }


                applyTheme();


                alert(
                    "Backup restored successfully."
                );


                openSettings();

            }

            catch(error) {

                alert(
                    "Unable to restore this backup file."
                );

            }

        };


    reader.readAsText(file);

}

</script>

   <script>

/* =========================
   PERSONALIZED HOME
   ========================= */

function getProfileName() {

    const profile = JSON.parse(
        localStorage.getItem("kkrProfile") || "{}"
    );

    if (
        profile.name &&
        profile.name.trim()
    ) {

        return profile.name.trim();

    }

    return "there";

}


/* Update Home greeting */

function getPersonalizedGreeting() {

    const hour =
        new Date().getHours();

    let greeting = "";

    if (hour < 12) {

        greeting = "Good Morning";

    } else if (hour < 17) {

        greeting = "Good Afternoon";

    } else if (hour < 21) {

        greeting = "Good Evening";

    } else {

        greeting = "Good Night";

    }


    return greeting +
        ", " +
        getProfileName() +
        " 👋";

}


/* Replace Home greeting */

function updateHomeGreeting() {

    const greetingElement =
        document.getElementById(
            "homeGreeting"
        );

    if (!greetingElement) return;


    greetingElement.innerHTML =
        getPersonalizedGreeting();

}

</script>

   <script>

/* =========================
   CONNECT HOME GREETING
   ========================= */

const originalShowHomeForGreeting = showHome;

showHome = function() {

    originalShowHomeForGreeting();

    setTimeout(function() {

        const homeTitle =
            document.querySelector(
                ".home-section .page-title"
            );

        if (!homeTitle) return;


        /*
         * The existing Home title is replaced
         * with the personalized greeting.
         */

        homeTitle.id =
            "homeGreeting";


        updateHomeGreeting();

    }, 0);

};

   </script>
